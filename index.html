<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f6e5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Фирмалар ва буйруқлар</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f6e5c'/%3E%3Cpath d='M20 16h18l8 8v24H20z' fill='%23fff'/%3E%3Cpath d='M26 32h14M26 38h14M26 44h8' stroke='%230f6e5c' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* Layout: firm rail on the left (top on phones), working area on the right; order editor = form beside a paper sheet */
:root{
  --bg:#eef1f0; --panel:#ffffff; --ink:#15211f; --muted:#5b6b67; --line:#d5dcda;
  --accent:#0f6e5c; --accent-ink:#ffffff; --accent-soft:#dcefe9;
  --paper:#fffdf8; --paper-ink:#1d1d1b;
  --draft:#6b7280; --draft-soft:#eceef1;
  --work:#e8750c; --work-soft:#fdebd8;
  --ok:#1a9a4b; --ok-soft:#dcf3e4;
  --danger:#b3261e;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-doc:"PT Serif",Georgia,"Times New Roman",serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1514; --panel:#172120; --ink:#e6ecea; --muted:#9aaaa6; --line:#2a3735;
  --accent:#3cc3a4; --accent-ink:#06201a; --accent-soft:#16372f;
  --paper:#f7f4ec; --paper-ink:#1d1d1b;
  --draft:#a4acb8; --draft-soft:#262d33;
  --work:#ff9a3d; --work-soft:#3a2513;
  --ok:#44d07a; --ok-soft:#153323;
  --danger:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1514; --panel:#172120; --ink:#e6ecea; --muted:#9aaaa6; --line:#2a3735;
  --accent:#3cc3a4; --accent-ink:#06201a; --accent-soft:#16372f;
  --paper:#f7f4ec; --paper-ink:#1d1d1b;
  --draft:#a4acb8; --draft-soft:#262d33;
  --work:#ff9a3d; --work-soft:#3a2513;
  --ok:#44d07a; --ok-soft:#153323;
  --danger:#ff8a80; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:280px 1fr;min-height:100%}
.rail{background:var(--panel);border-right:1px solid var(--line);padding:20px 16px;display:flex;flex-direction:column;gap:16px;min-width:0}
.brand{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:-.01em;line-height:1.2}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.02em;margin-top:4px}
.firmlist{display:flex;flex-direction:column;gap:4px;list-style:none;margin:0;padding:0}
.firmlist button{width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:9px 10px;display:flex;flex-direction:column;gap:1px}
.firmlist button:hover{background:var(--bg)}
.firmlist button[aria-current="true"]{background:var(--accent-soft)}
.firmlist .fn{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.firmlist .fi{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.main{padding:24px clamp(16px,3vw,36px);min-width:0;display:flex;flex-direction:column;gap:20px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.work{background:var(--work);border-color:var(--work);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:none}
a.btn{text-decoration:none;color:var(--ink)}

.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.head h1{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,2.6vw,26px);margin:0;letter-spacing:-.015em;text-wrap:balance;line-height:1.2}
.head .sub{color:var(--muted);font-size:13.5px;margin-top:4px}
.back{border:0;background:none;color:var(--muted);padding:0;font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.back:hover{color:var(--ink)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}

/* firms overview */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.fcard{padding:16px;display:flex;flex-direction:column;gap:10px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:var(--r)}
.fcard:hover{border-color:var(--accent)}
.fcard .t{font-weight:700;font-size:15.5px}
.fcard .m{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.counts{display:flex;gap:6px;flex-wrap:wrap}

/* status pills */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px 3px 6px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill svg{width:18px;height:18px;flex:none}
.pill.draft{background:var(--draft-soft);color:var(--draft)}
.pill.signing{background:var(--work-soft);color:var(--work)}
.pill.signed{background:var(--ok-soft);color:var(--ok)}
.spin{animation:spin 2.4s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}

/* registry */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--bg)}
tbody tr:last-child td{border-bottom:0}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

/* requisites */
.reqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:0}
.req{padding:12px 16px;border-bottom:1px solid var(--line);min-width:0}
.req .k{font-size:12px;color:var(--muted)}
.req .v{font-weight:500;overflow-wrap:anywhere}
.req .v.mono{font-family:var(--f-mono);font-size:13.5px}
.req .v.none{color:var(--muted);font-weight:400;font-style:italic}

/* forms */
.form{display:flex;flex-direction:column;gap:22px}
fieldset{border:0;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
legend{font-family:var(--f-display);font-weight:500;font-size:14px;margin-bottom:12px;padding:0}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:500;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
.field input:focus,.field select:focus{border-color:var(--accent);outline:none}
.field input:disabled,.field select:disabled{opacity:.7}
.field.wide{grid-column:1/-1}
.hint{font-size:12px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.actions .sp{flex:1}

/* template picker */
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.tpl{text-align:left;padding:18px;display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:var(--r)}
.tpl:hover{border-color:var(--accent)}
.tpl .t{font-weight:700}
.tpl .d{font-size:13.5px;color:var(--muted)}
.tpl .tag{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}

/* editor */
.editor{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:20px;align-items:start}
.editor .side{padding:18px;display:flex;flex-direction:column;gap:16px}
.editor .side fieldset{grid-template-columns:1fr;gap:12px}
.auto{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:3px}
.auto b{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.statusbar{display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1px solid var(--line)}
.statusbar .row{display:flex;flex-wrap:wrap;gap:8px}

.sheetwrap{overflow-x:auto;min-width:0}
.sheet{background:var(--paper);color:var(--paper-ink);font-family:var(--f-doc);font-size:15px;line-height:1.6;padding:clamp(22px,5vw,56px) clamp(20px,5vw,60px);border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 8px 28px rgba(0,0,0,.08);max-width:760px;min-width:0}
.sheet .org{text-align:center;font-weight:700;text-transform:uppercase;font-size:14px;letter-spacing:.02em}
.sheet .orgm{text-align:center;font-size:12.5px;color:#555;border-bottom:1.5px solid #1d1d1b;padding-bottom:10px;margin-bottom:22px}
.sheet h2{text-align:center;font-size:20px;letter-spacing:.2em;margin:0}
.sheet .meta{display:flex;justify-content:space-between;gap:12px;font-size:14px;margin:10px 0 18px}
.sheet .subj{text-align:center;font-weight:700;margin-bottom:18px;text-wrap:balance}
.sheet p{margin:0 0 10px;text-align:justify}
.sheet .order{text-align:center;font-weight:700;letter-spacing:.25em;margin:16px 0 12px}
.sheet ol{margin:0 0 10px;padding-left:22px}
.sheet ol li{margin-bottom:8px;text-align:justify}
.sheet .sign{display:grid;grid-template-columns:1fr auto 1fr;gap:8px 16px;margin-top:40px;align-items:end;font-size:14.5px}
.sheet .sign .ln{border-bottom:1px solid #1d1d1b;width:110px;height:1px}
.sheet .sign .nm{text-align:right;font-weight:700}
.sheet .fill{background:#fff2b8;border-radius:3px;padding:0 3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.sheet .fill.fa{background:#d9efe7}
.sheet .fill.miss{background:#ffd9d4;color:#8a1c12;font-style:italic}
.sheet.clean .fill{background:none;padding:0;color:inherit;font-style:normal}
.stamp{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--ok);color:var(--ok);border-radius:6px;padding:4px 10px;font-family:var(--f-body);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;transform:rotate(-3deg);margin-top:18px}

.who{font-weight:600}
.lastmod{display:flex;flex-direction:column;gap:1px;font-size:13px;line-height:1.35}
.lastmod .num{font-size:12px;color:var(--muted)}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.hist li{display:grid;grid-template-columns:10px 1fr;gap:10px;font-size:13px;line-height:1.4}
.hist li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:5px}
.hist .num{color:var(--muted);font-size:12px}
.me{font-size:12.5px;color:var(--muted)}
.me b{color:var(--ink);font-weight:600}
.banner{background:var(--work-soft);color:var(--ink);border-radius:8px;padding:10px 14px;font-size:13.5px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;font-weight:500;z-index:10;max-width:calc(100% - 32px)}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--danger);border-radius:8px;padding:10px 12px;font-size:13.5px}

@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .rail{border-right:0;border-bottom:1px solid var(--line);padding:14px 16px;gap:10px}
  .firmlist{flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .firmlist li{flex:none;max-width:220px}
  .firmlist button{border:1px solid var(--line)}
  .railtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .rail .label{display:none}
  .editor{grid-template-columns:1fr}
  .main{padding-block:18px}
  .sheet .sign{grid-template-columns:1fr auto;}
  .sheet .sign .nm{grid-column:1/-1;text-align:left}
}
@media (min-width:861px){.railtop{display:flex;flex-direction:column;gap:14px}}

.who{font-weight:600}
.lastmod{display:flex;flex-direction:column;gap:1px;font-size:13px;line-height:1.35}
.lastmod .num{font-size:12px;color:var(--muted)}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.hist li{display:grid;grid-template-columns:10px 1fr;gap:10px;font-size:13px;line-height:1.4}
.hist li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:5px}
.hist .num{color:var(--muted);font-size:12px}
.me{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.me b{color:var(--ink);font-weight:600}
.me a,.linkbtn{color:var(--accent);font-size:12.5px;text-decoration:none;background:none;border:0;padding:0;font-weight:500}
.me a:hover,.linkbtn:hover{text-decoration:underline}
.gate{min-height:100%;display:grid;place-items:center;padding:32px 16px}
.gatecard{max-width:560px;width:100%;padding:clamp(22px,4vw,36px);display:flex;flex-direction:column;gap:14px}
.gatecard h1{font-family:var(--f-display);font-size:22px;margin:6px 0 0;letter-spacing:-.01em}
.gatecard p{margin:0}
.gbrand{font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--accent)}
.gbrand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted)}
.gerr{background:var(--work-soft);border-radius:8px;padding:10px 12px;font-size:13.5px}
.btn.big{padding:12px 18px;font-size:15px;align-self:flex-start}
.gopts{display:grid;gap:10px}
.gopt{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.gopt:hover{border-color:var(--accent)}
.gopt span{font-size:13.5px;color:var(--muted)}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.steps a{color:var(--accent);font-weight:600}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;padding:10px 16px;font-size:13.5px;background:var(--work-soft);border-bottom:1px solid var(--line)}
.backup{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.backup.due{border-color:var(--work);background:var(--work-soft)}
.bk-text{display:flex;flex-direction:column;gap:2px;min-width:0;font-size:13.5px}
.bk-text span{color:var(--muted)}
.backup.due .bk-text span{color:var(--ink)}
.checkline{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer;grid-column:1/-1;padding:4px 0}
.checkline input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent)}
.field input.bad{border-color:var(--danger)}
.lenhint{font-size:11px;color:var(--muted);display:none}
.field input.bad+.lenhint{display:block;color:var(--danger)}
.fsec{display:flex;flex-direction:column;gap:12px;padding-top:6px;border-top:1px solid var(--line)}
.fsec-h{display:flex;gap:12px;align-items:center}
.fsec-h b{display:block;font-family:var(--f-display);font-weight:500;font-size:14px}
.fsec-h span{font-size:13px;color:var(--muted)}
.mi{width:46px;height:46px;flex:none;display:inline-block}
.mi svg{width:100%;height:100%;display:block}
.ni{display:inline-block;flex:none;width:var(--s,40px);height:var(--s,40px);filter:drop-shadow(0 0 5px color-mix(in srgb,var(--c) 55%,transparent))}
.ni svg{width:100%;height:100%;display:block}
.gh{display:inline-flex;align-items:center;gap:10px}
.label .gh{font-size:12px;color:var(--ink)}
.backup .bk-wrap{display:flex;gap:12px;align-items:center}
.al-h:has(.ni){align-items:center}
.lst{display:flex;flex-direction:column;gap:10px}
.lst-item{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--bg);display:flex;flex-direction:column;gap:10px}
.lst-head{display:flex;align-items:center;gap:8px}
.lst-head .linkbtn{margin-left:auto}
.lst-n{width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;display:grid;place-items:center}
.lst-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.lst-grid .field.wide{grid-column:1/-1}
.btn.addrow{align-self:flex-start;border-style:dashed}
.linkbtn.danger{color:var(--danger)}
.curb{display:inline-block;font-family:var(--f-mono);font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:6px;background:var(--ink);color:var(--bg);letter-spacing:.04em}
.ftotal{font-size:13.5px;font-weight:600;color:var(--ok)}
.ftotal.warn{color:var(--work)}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;align-items:start}
.modbox{border:1.5px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}
.modbox.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.modbox.on:has(.modbody){grid-column:1/-1}
.mods.view .modbox.on:has(.modbody){grid-column:auto}
.modtog{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;user-select:none}
.modtog.static{cursor:default}
.modtog input{position:absolute;opacity:0;pointer-events:none}
.modtog .mt{display:flex;flex-direction:column;min-width:0}
.modtog .mt b{font-size:14px;font-weight:600}
.modtog .mt span{font-size:12px;color:var(--muted)}
.modtog .chk{margin-left:auto;width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);flex:none;display:grid;place-items:center}
.modbox.on .chk{background:var(--accent);border-color:var(--accent)}
.modbox.on .chk::after{content:"";width:10px;height:5px;border:2.2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.modbox:not(.on) .mi{filter:grayscale(.6);opacity:.7}

const getPath=(o,p)=>p.split(".").reduce((a,k)=>a==null?undefined:a[k],o);

const digits=s=>String(s||"").replace(/\D/g,"");
const curFromAcc=n=>{ const d=digits(n); return d.length>=8?(CURRENCIES[d.slice(5,8)]||""):""; };

function guessCard(f4){ const d=digits(f4); if(d.startsWith("9860")) return "HUMO"; if(d.startsWith("8600")||d.startsWith("5614")) return "UZCARD"; if(d[0]==="4") return "Visa"; if(d[0]==="5"||d[0]==="2") return "Mastercard"; return ""; }
function cardExpiry(exp){ const m=/^(\d{2})\s*\/\s*(\d{2,4})$/.exec(String(exp||"").trim()); if(!m) return null; let y=+m[2]; if(y<100) y+=2000; const end=new Date(y,+m[1],0,23,59); const days=Math.floor((end-Date.now())/86400000); return {days, label: days<0?"муддати ўтган":days<=30?`${days} кун қолди`:""}; }

  return {cls:"vat-yes",t:"ҚҚС тўловчи"};

function inputHTML(path,def,val,item){
  const [k,l0,ph,kind,ex={}]=def; const l=ex.labelIf?ex.labelIf(item||{}):l0;
  const id="ff_"+path.replace(/\./g,"_");
  const lenAttr=ex.len?` data-len="${ex.len}"`:"";
  const bad=ex.len&&val&&digits(val).length!==ex.len?" bad":"";
  const wide=kind==="wide"?" wide":"";
  if(kind==="check") return `<label class="checkline${wide}"><input type="checkbox" id="${id}" name="${path}" ${val?"checked":""}><span>${l}</span></label>`;
  if(kind==="select") return `<div class="field"><label for="${id}">${l}</label><select id="${id}" name="${path}">${ex.opts.map(o=>`<option value="${esc(o)}" ${String(val||"")===o?"selected":""}>${o?esc(o):"—"}</option>`).join("")}</select></div>`;
  const type=kind==="date"?"date":kind==="tel"?"tel":"text";
  const im=kind==="mono"?' inputmode="numeric"':"";
  return `<div class="field${wide}"><label for="${id}">${l}${path==="name"?" *":""}</label><input id="${id}" name="${path}" type="${type}"${im}${lenAttr} class="${kind==="mono"?"mono":""}${bad}" placeholder="${esc(ph||"")}" value="${esc(val??"")}">${ex.len?`<span class="lenhint">${ex.len} рақам</span>`:""}</div>`;
}

function onFirmInput(el, isChange){
  const path=el.name; if(!path) return;
  const val=el.type==="checkbox"?el.checked:el.value;
  setPath(V.draft,path,val);
  if(el.dataset.len){ el.classList.toggle("bad", !!el.value && digits(el.value).length!==+el.dataset.len); }
  let m;
  if((m=/^accounts\.(\d+)\.num$/.exec(path))){ const a=V.draft.accounts[m[1]]; const c=curFromAcc(val); if(c&&!a.curManual){ a.cur=c; const s=document.querySelector(`[name="accounts.${m[1]}.cur"]`); if(s) s.value=c; const b=el.closest(".lst-item")?.querySelector(".curb"); if(b) b.textContent=c; } }
  if((m=/^accounts\.(\d+)\.cur$/.exec(path))) V.draft.accounts[m[1]].curManual=true;
  if((m=/^modules\.card\.items\.(\d+)\.first4$/.exec(path))){ const it=V.draft.modules.card.items[m[1]]; const g=guessCard(val); if(g&&!it.typeManual){ it.type=g; const s=document.querySelector(`[name="modules.card.items.${m[1]}.type"]`); if(s) s.value=g; } }
  if((m=/^modules\.card\.items\.(\d+)\.type$/.exec(path))) V.draft.modules.card.items[m[1]].typeManual=true;
  const fund=num(V.draft.charterFund);
  const setInp=(p,v)=>{ const i=document.querySelector(`[name="${p}"]`); if(i) i.value=v; };
  if((m=/^founders\.(\d+)\.pct$/.exec(path)) && fund){ const it=V.draft.founders[m[1]]; it.sum=String(Math.round(fund*num(val)/100*100)/100); setInp(`founders.${m[1]}.sum`,it.sum); }
  if((m=/^founders\.(\d+)\.sum$/.exec(path)) && fund){ const it=V.draft.founders[m[1]]; it.pct=String(Math.round(num(val)/fund*10000)/100); setInp(`founders.${m[1]}.pct`,it.pct); }
  if(path==="charterFund" && fund){ (V.draft.founders||[]).forEach((it,i)=>{ if(it.pct!==undefined&&it.pct!==""){ it.sum=String(Math.round(fund*num(it.pct)/100*100)/100); setInp(`founders.${i}.sum`,it.sum); } }); }
  if(/^founders\./.test(path)||path==="charterFund"){ const t=$("#fTotal"); if(t){ t.textContent=foundersTotalText(V.draft); t.classList.toggle("warn", Math.abs(founderTotal(V.draft)-100)>0.001); } }
  if(path==="vatFromStart" && val && V.draft.regDate){ V.draft.vatDate=V.draft.regDate; setInp("vatDate",V.draft.regDate); }
  if(path==="regDate" && V.draft.vatFromStart){ V.draft.vatDate=val; setInp("vatDate",val); }
  if(isChange && (/^modules\.\w+\.on$/.test(path) || /\.kind$/.test(path) || /^accounts\.\d+\.type$/.test(path))) rerenderForm();
}

let TOKEN=null, TOKEN_EXP=0;

/* must be called synchronously from a click, or the browser blocks Google's popup */
function requestToken(prompt){
  return new Promise((res,rej)=>{
    const client = google.accounts.oauth2.initTokenClient({
      client_id: CONFIG.CLIENT_ID, scope: SCOPES,
      callback: r=>{
        if(r.error){ rej(new Error(r.error_description||r.error)); return; }
        TOKEN=r.access_token; TOKEN_EXP=Date.now()+(Number(r.expires_in||3600)-120)*1000;
        ss.set(LSK.tok, JSON.stringify({t:TOKEN,e:TOKEN_EXP}));
        $("#authBar").hidden=true; scheduleExpiry(); res();
      },
      error_callback: e=>rej(new Error(e?.type==="popup_closed"?"Кириш ойнаси ёпилди":"Кириш ойнаси очилмади. Браузерда pop-up ойналарга рухсат беринг.")),
    });
    client.requestAccessToken({ prompt: prompt||"", login_hint: ME.email||undefined });
  });
}
let expTimer=null;
function scheduleExpiry(){ clearTimeout(expTimer); expTimer=setTimeout(needAuth, Math.max(0,TOKEN_EXP-Date.now())); }
function needAuth(){ if(!DEMO && !$("#gate").hidden) return; $("#authBar").hidden=false; }

async function api(method, url, body){
  if(!TOKEN || Date.now()>TOKEN_EXP){ needAuth(); throw new AuthErr("Сессия тугаган"); }
  let r;
  for(let attempt=0;;attempt++){
    try{
      r = await fetch(url,{ method, headers:{ Authorization:"Bearer "+TOKEN, ...(body?{"Content-Type":"application/json"}:{}) }, body: body?JSON.stringify(body):undefined });
    }catch(e){ throw new Error("Интернет алоқаси йўқ"); }
    if((r.status===429||r.status===503)&&attempt<5){ await new Promise(ok=>setTimeout(ok,(2**attempt)*1500+Math.random()*500)); continue; }
    break;
  }
  if(r.status===401){ TOKEN=null; ss.del(LSK.tok); needAuth(); throw new AuthErr("Сессия тугаган"); }
  if(!r.ok){
    let m=""; try{ m=(await r.json()).error?.message||""; }catch(e){}
    const err=new Error(r.status===403||r.status===404?"Жадвалга кириш ҳуқуқи йўқ ёки у ўчирилган":(m||"Хато "+r.status)); err.status=r.status; throw err;
  }
  return r.status===204 ? null : r.json();
}

const GS = {
  async create(){
    const r = await api("POST", SHEETS, {
      properties:{ title:"Фирмалар базаси (дастур)", locale:"ru_RU", timeZone:"Asia/Tashkent" },
      sheets:["firms","orders","recs","gtd","log"].map(t=>({properties:{title:t, gridProperties:{frozenRowCount:1}}})),
    });
    const id = r.spreadsheetId;
    await api("POST", `${SHEETS}/${id}/values:batchUpdate`, { valueInputOption:"RAW",
      data:Object.entries(HEAD).map(([k,h])=>({range:`${k}!A1`, values:[h]})) });
    return id;
  },
  async check(id){
    const r = await api("GET", `${SHEETS}/${id}?fields=sheets.properties.title`);
    const names = (r.sheets||[]).map(s=>s.properties.title);
    return ["firms","orders","log"].every(n=>names.includes(n));
  },
  async ensureRecs(){
    if(this._recsOk===DB_ID) return;
    const r = await api("GET", `${SHEETS}/${DB_ID}?fields=sheets.properties.title`);
    for(const nm of ["recs","gtd"]){ if(!(r.sheets||[]).some(s=>s.properties.title===nm)){
      await api("POST", `${SHEETS}/${DB_ID}:batchUpdate`, {requests:[{addSheet:{properties:{title:nm, gridProperties:{frozenRowCount:1}}}}]});
      await api("PUT", `${SHEETS}/${DB_ID}/values/${encodeURIComponent(nm+"!A1")}?valueInputOption=RAW`, {values:[HEAD[nm]]});
    } }
    this._recsOk=DB_ID;
  },
  async load(){
    await this.ensureRecs();
    const q = ["firms!A2:E","orders!A2:E","log!A2:F","recs!A2:E"].map(x=>"ranges="+encodeURIComponent(x)).join("&");
    const r = await api("GET", `${SHEETS}/${DB_ID}/values:batchGet?${q}&valueRenderOption=UNFORMATTED_VALUE`);
    const [f,o,l,rc] = r.valueRanges.map(v=>v.values||[]);
    return { firms:parseRows(f), orders:parseRows(o), recs:parseRows(rc||[]),
      log:l.filter(x=>x&&x[0]).map(x=>({at:+x[0]||0,email:x[1]||"",name:x[2]||"",kind:x[3]||"",id:x[4]||"",note:x[5]||""})) };
  },
  async loadKind(kind){
    await this.ensureRecs();
    const r = await api("GET", `${SHEETS}/${DB_ID}/values/${encodeURIComponent(kind+"!A2:E")}?valueRenderOption=UNFORMATTED_VALUE`);
    return parseRows(r.values||[]);
  },
  async readRow(kind,row){
    const r = await api("GET", `${SHEETS}/${DB_ID}/values/${encodeURIComponent(`${kind}!A${row}:E${row}`)}?valueRenderOption=UNFORMATTED_VALUE`);
    return (r.values||[])[0]||[];
  },
  async writeRow(kind,row,vals){
    await api("PUT", `${SHEETS}/${DB_ID}/values/${encodeURIComponent(`${kind}!A${row}:E${row}`)}?valueInputOption=RAW`, {values:[vals]});
  },
  async appendRow(kind,vals){
    const r = await api("POST", `${SHEETS}/${DB_ID}/values/${encodeURIComponent(`${kind}!A:${kind==="log"?"F":"E"}`)}:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS`, {values:[vals]});
    const m = /![A-Z]+(\d+)/.exec(r?.updates?.updatedRange||""); return m?+m[1]:null;
  },
};

const STORE = DEMO ? DS : GS;

/* ---------- generic operations ---------- */
async function refresh(){
  const d = await STORE.load();
  ROWS.firms=d.firms; ROWS.orders=d.orders; ROWS.recs=d.recs||{}; LOG=d.log;
  rebuild(); S.ready=true; LAST_SYNC=Date.now(); setSync();
  ratingAuto();
  if(!GTD_LOADED&&!GTD_LOADING) ensureGtd().then(()=>{ if(liveViews.has(V.view)&&!V.gImport&&!V.ctEdit&&!V.ckEdit&&!V.loanEdit) render(); else renderRail(); }).catch(()=>{});
}
async function assertFresh(kind, ex, id){
  const cur = await STORE.readRow(kind, ex.row);
  if(cur[0]!==id || (+cur[2]||0)!==ex.updatedAt){ await refresh(); throw new ConflictErr(); }
}
async function addLog(kind,id,note,at){
  const e={at,email:ME.email,name:ME.name,kind,id,note};
  await STORE.appendRow("log",[at,e.email,e.name,kind,id,note]);
  LOG.push(e);
}
async function putItem(kind, obj, note){
  const ex = ROWS[kind][obj.id];
  if(ex) await assertFresh(kind, ex, obj.id);
  const at = Date.now();
  const o = {...obj, updatedAt:at, updatedBy:ME.email};
  if(!o.createdBy) o.createdBy = ME.email;
  const vals = [o.id, JSON.stringify(o), at, ME.email, ""];
  let row;
  if(ex){ await STORE.writeRow(kind, ex.row, vals); row=ex.row; }
  else  { row = await STORE.appendRow(kind, vals); }
  ROWS[kind][o.id] = {row:row||0, obj:o, updatedAt:at, updatedBy:ME.email, deleted:false};
  await addLog(kind, o.id, note, at);
  if(!row) await refresh(); else rebuild();
  return o;
}
async function delItem(kind, id, note){
  const ex = ROWS[kind][id]; if(!ex) return;
  await assertFresh(kind, ex, id);
  const at = Date.now();
  await STORE.writeRow(kind, ex.row, [id, JSON.stringify({...ex.obj, updatedAt:at, updatedBy:ME.email}), at, ME.email, 1]);
  ex.deleted=true; ex.updatedAt=at; ex.updatedBy=ME.email;
  await addLog(kind, id, note, at);
  rebuild();
}
function explain(err){
  if(err instanceof ConflictErr) return "Бу ҳужжатни бошқа ходим ҳозиргина ўзгартирган. Янги версия юкланди, ўзгаришингизни қайта киритинг.";
  if(err instanceof AuthErr) return "Сессия тугади. Юқоридаги «Қайта кириш» тугмасини босинг, кейин яна сақланг.";
  return "Сақланмади: "+(err?.message||"номаълум хато");
}

const p2=n=>String(n).padStart(2,"0");
const dnum=iso=>{ const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso||""); return m?Date.UTC(+m[1],+m[2]-1,+m[3])/86400000:null; };
const localToday=()=>{ const d=new Date(); return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate()); };
const m2=x=>(Math.round((x||0)*100)/100).toLocaleString("ru-RU",{minimumFractionDigits:2,maximumFractionDigits:2}).replace(",",".");
const m0=x=>Math.round(x||0).toLocaleString("ru-RU");

function loanTerm(a,b){
  const A=/^(\d{4})-(\d{2})-(\d{2})/.exec(a||""), B=/^(\d{4})-(\d{2})-(\d{2})/.exec(b||""); if(!A||!B) return "";
  let mo=(+B[1]-+A[1])*12+(+B[2]-+A[2]); if(+B[3]<+A[3]) mo--; if(mo<0) return "";
  return Math.floor(mo/12)+" йил "+(mo%12)+" ой";
}
const loanRateText=L=>L.kind==="процентсиз"?"процентсиз":(L.rate!==""&&L.rate!=null?String(L.rate).replace(".",",")+"%":"");
const loanTax=L=>(L.dir==="out"?0:(L.taxRate===""||L.taxRate==null?5:num(L.taxRate)));
/* Excel'даги формулалар билан бир хил:
   ой кунлари = MIN(ой охири, қайтариш санаси) − MAX(ой боши, шартнома санаси) + 1
   ой бошидаги асосий қарз = сумма − шу ойгача қайтарилганлар
   фоиз = ставка/365 × (қарз × кун − Σ ой ичидаги қайтариш × (ой охиригача қолган кун))
   солиқ = фоиз × солиқ ставкаси (5%) */
function loanCalc(L){
  const amt=num(L.amount), s=dnum(L.date), e=dnum(L.endDate), td=dnum(localToday());
  const rate=L.kind==="процентсиз"?0:num(L.rate)/100, tax=loanTax(L)/100;
  const reps=(L.repays||[]).map(r=>({d:dnum(r.date),s:num(r.sum)})).filter(r=>r.d!=null&&r.s);
  const out={rows:[],years:[],totI:0,totT:0,amt,repaid:0,repaidToday:0,bal:amt,balToday:amt,toDateI:0,toDateT:0,s,e,td};
  reps.forEach(r=>{ out.repaid+=r.s; if(r.d<=td) out.repaidToday+=r.s; });
  out.bal=amt-out.repaid; out.balToday=amt-out.repaidToday;
  if(s==null||e==null||e<s||!amt) return out;
  const sd=new Date(s*86400000); let y=sd.getUTCFullYear(), m=sd.getUTCMonth(), cumI=0, cumT=0, n=0; const yrs={};
  while(n<1200){
    const J=Date.UTC(y,m,1)/86400000; if(J>e) break;
    const EOM=Date.UTC(y,m+1,0)/86400000, K=Math.max(J,s), Lq=Math.min(EOM,e), C=Lq-K+1;
    const D=amt-reps.filter(r=>r.d<J).reduce((a,r)=>a+r.s,0);
    const adj=reps.filter(r=>r.d>=K&&r.d<=Lq).reduce((a,r)=>a+r.s*(Lq-r.d+1),0);
    const I=rate/365*(D*C-adj), T=I*tax; cumI+=I; cumT+=T; n++;
    const rep=reps.filter(r=>r.d>=J&&r.d<=EOM).reduce((a,r)=>a+r.s,0);
    out.rows.push({n,y,m,days:C,D,I,T,cumI,cumT,rep,cur:td>=J&&td<=EOM,past:EOM<td});
    if(!yrs[y]) yrs[y]={y,I:0,T:0,rep:0}; yrs[y].I+=I; yrs[y].T+=T; yrs[y].rep+=rep;
    if(EOM<td){ out.toDateI+=I; out.toDateT+=T; }
    m++; if(m>11){ m=0; y++; }
  }
  out.totI=cumI; out.totT=cumT; out.years=Object.values(yrs).sort((a,b)=>a.y-b.y);
  return out;
}
function loanStatus(L,c){

  if(c.e!=null && c.e-c.td<=30) return {cls:"soon",t:(c.e-c.td)+" кун қолди"};
  return {cls:"act",t:"Амалда"};
}

  return out;
}

/* ---------- ойлик бухгалтерия справкаси ва проводкалар ---------- */
const LOAN_DIRS={in:"Фирма қарз олган (фоиз тўлайди)",out:"Фирма қарз берган (фоиз олади)"};
const ACC_NAMES={"5110":"Ҳисоб-китоб счёти","6820":"Қисқа муддатли қарзлар","7820":"Узоқ муддатли қарзлар","9610":"Фоизлар кўринишидаги харажатлар","6920":"Ҳисобланган фоизлар","6410":"Бюджетга тўловлар бўйича қарз","5830":"Берилган қисқа муддатли қарзлар","0990":"Бошқа узоқ муддатли дебиторлик қарзлари","4830":"Олинадиган фоизлар","9530":"Фоизлар кўринишидаги даромадлар"};
function loanMonths(L){ const A=/^(\d{4})-(\d{2})-(\d{2})/.exec(L.date||""), B=/^(\d{4})-(\d{2})-(\d{2})/.exec(L.endDate||""); if(!A||!B) return 0; let mo=(+B[1]-+A[1])*12+(+B[2]-+A[2]); if(+B[3]<+A[3]) mo--; return mo; }
function loanAccDefaults(L){
  const long=loanMonths(L)>=12 && !(loanMonths(L)===12 && L.endDate.slice(5)===L.date.slice(5));
  return (L.dir||"in")==="out"
    ? {main:long?"0990":"5830", intA:"4830", intB:"9530", tax:"", cash:"5110"}
    : {main:long?"7820":"6820", intA:"9610", intB:"6920", tax:"6410", cash:"5110"};
}
const loanAcc=L=>({...loanAccDefaults(L), ...Object.fromEntries(Object.entries(L.acc||{}).filter(([,v])=>String(v||"").trim()))});
const ymKey=(y,m)=>y+"-"+p2(m+1);
function prevMonthKey(){ const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-1); return ymKey(d.getFullYear(),d.getMonth()); }
function loanEntries(L,key){
  const [y,mm]=key.split("-").map(Number), m=mm-1; const out=[]; const a=loanAcc(L); const dir=L.dir||"in";
  const eom=y+"-"+p2(mm)+"-"+p2(new Date(Date.UTC(y,mm,0)).getUTCDate());
  const who=`${L.person||""}, шартнома № ${L.number||"—"} (${fmtDate(L.date)})`;
  if((L.date||"").slice(0,7)===key && num(L.amount)>0)
    out.push(dir==="out"?{date:L.date,dt:a.main,kt:a.cash,sum:r2(num(L.amount)),text:"Займ берилди: "+who}
                        :{date:L.date,dt:a.cash,kt:a.main,sum:r2(num(L.amount)),text:"Займ олинди: "+who});
  const c=loanCalc(L); const row=c.rows.find(r=>r.y===y&&r.m===m);
  const accDate=(L.endDate&&L.endDate<eom)?L.endDate:eom;
  if(row && r2(row.I)>0){
    const I=r2(row.I), T=r2(row.T);
    if(dir==="out") out.push({date:accDate,dt:a.intA,kt:a.intB,sum:I,text:`Фоиз ҳисобланди (${MONTHS_UZ[m]} ${y}, ${row.days} кун): `+who});
    else{
      out.push({date:accDate,dt:a.intA,kt:a.intB,sum:I,text:`Фоиз ҳисобланди (${MONTHS_UZ[m]} ${y}, ${row.days} кун): `+who});
      if(T>0 && a.tax) out.push({date:accDate,dt:a.intB,kt:a.tax,sum:T,text:`Фоиз даромадидан ЖШДС ушланди (${loanTax(L)}%): `+(L.person||"")});
    }
  }
  (L.repays||[]).filter(r=>(r.date||"").slice(0,7)===key&&num(r.sum)>0).sort((p,q)=>p.date.localeCompare(q.date)).forEach(r=>
    out.push(dir==="out"?{date:r.date,dt:a.cash,kt:a.main,sum:r2(num(r.sum)),text:"Займ қисман қайтарилди: "+who}
                        :{date:r.date,dt:a.main,kt:a.cash,sum:r2(num(r.sum)),text:"Займ қисман қайтарилди: "+who}));
  return out.sort((p,q)=>p.date.localeCompare(q.date));
}
function loanRepData(f,key){
  const [y,mm]=key.split("-").map(Number), m=mm-1;
  const lines=[], entries=[];
  firmLoans(f.id).forEach(L=>{
    const c=loanCalc(L); const row=c.rows.find(r=>r.y===y&&r.m===m); const en=loanEntries(L,key);
    if(row) lines.push({L,row,dir:L.dir||"in",I:r2(row.I),T:(L.dir||"in")==="in"?r2(row.T):0});
    en.forEach(e=>entries.push({...e,L}));
  });

/* ---------- Чек листлар ---------- */
const CK_PER={
  daily:{t:"Ҳар кунлик",s:"кунлик",c:"#22d3ee",l:"#a5f3fc"},
  weekly:{t:"Ҳар ҳафталик",s:"ҳафталик",c:"#a78bfa",l:"#ddd6fe"},
  monthly:{t:"Ҳар ойлик",s:"ойлик",c:"#34d399",l:"#a7f3d0"},
  quarterly:{t:"Ҳар чораклик",s:"чораклик",c:"#fbbf24",l:"#fde68a"},
  yearly:{t:"Ҳар йиллик",s:"йиллик",c:"#f472b6",l:"#fbcfe8"},
  once:{t:"Бир марталик",s:"бир марталик",c:"#94a3b8",l:"#e2e8f0"},
};
const WD=["Душанба","Сешанба","Чоршанба","Пайшанба","Жума","Шанба","Якшанба"];
const WD_S=["Ду","Се","Чо","Па","Жу","Ша","Як"];
const QN=["I","II","III","IV"];
const DAY=86400000;
const d2iso=n=>new Date(n*DAY).toISOString().slice(0,10);
const wdOf=n=>(new Date(n*DAY).getUTCDay()+6)%7;
const tdNum=()=>dnum(localToday());
const firmChecks=id=>S.recs.filter(r=>r.firmId===id&&r.type==="check").sort((a,b)=>(a.name||"").localeCompare(b.name||""));
function ckKey(C,n){
  const d=new Date(n*DAY), y=d.getUTCFullYear(), m=d.getUTCMonth();
  switch(C.period){
    case "daily": return d2iso(n);
    case "weekly": return d2iso(n-wdOf(n));
    case "monthly": return y+"-"+p2(m+1);
    case "quarterly": return y+"-Q"+(Math.floor(m/3)+1);
    case "yearly": return String(y);
    default: return "once";
  }
}
function ckRange(C,key){
  switch(C.period){
    case "daily": { const n=dnum(key); return [n,n]; }
    case "weekly": { const n=dnum(key); return [n,n+6]; }
    case "monthly": { const [y,m]=key.split("-").map(Number); return [Date.UTC(y,m-1,1)/DAY, Date.UTC(y,m,0)/DAY]; }
    case "quarterly": { const y=+key.slice(0,4), q=+key.slice(6); return [Date.UTC(y,(q-1)*3,1)/DAY, Date.UTC(y,q*3,0)/DAY]; }
    case "yearly": { const y=+key; return [Date.UTC(y,0,1)/DAY, Date.UTC(y,11,31)/DAY]; }
    default: { const a=dnum(C.startDate)??tdNum(); return [a, dnum(C.dueDate)??a]; }
  }
}
function ckNext(C,key,dir){
  if(C.period==="once") return key;
  const [a,b]=ckRange(C,key); let n=dir>0?b+1:a-1; let k=ckKey(C,n);
  if(C.period==="daily"&&C.workdays){ let g=0; while(wdOf(dnum(k))>4&&g++<7){ n+=dir; k=ckKey(C,n); } }
  return k;
}
const ckValid=(C,key)=>C.period==="once"||!C.startDate||ckRange(C,key)[1]>=dnum(C.startDate);
function ckDeadline(C,key){
  const [a,b]=ckRange(C,key); const day=parseInt(C.dueDay)||0;
  const clampDay=(y,m,dd)=>{ const last=new Date(Date.UTC(y,m+1,0)).getUTCDate(); return Date.UTC(y,m,Math.min(dd||last,last))/DAY; };
  switch(C.period){
    case "daily": return a;
    case "weekly": return a+(C.dueWd===""||C.dueWd==null?4:+C.dueWd);
    case "monthly": case "quarterly": { const d=new Date(b*DAY); return clampDay(d.getUTCFullYear(), d.getUTCMonth()+(C.dueNext?1:0), day); }
    case "yearly": { const y=new Date(a*DAY).getUTCFullYear()+(C.dueNext?1:0); return clampDay(y,(parseInt(C.dueMonth)||12)-1,day); }
    default: return dnum(C.dueDate);
  }
}
function ckLabel(C,key){
  switch(C.period){
    case "daily": { const n=dnum(key); return fmtDate(key)+" ("+WD[wdOf(n)]+")"; }
    case "weekly": { const n=dnum(key); return fmtDate(key).slice(0,5)+" – "+fmtDate(d2iso(n+6))+" ҳафтаси"; }
    case "monthly": { const [y,m]=key.split("-").map(Number); return MONTHS_UZ[m-1]+" "+y; }
    case "quarterly": return QN[+key.slice(6)-1]+" чорак "+key.slice(0,4);
    case "yearly": return key+" йил";
    default: return C.dueDate?"муддат "+fmtDate(C.dueDate):"бир марталик";
  }
}
function ckProg(C,key){ const its=C.items||[]; const m=C.done?.[key]||{}; const d=its.filter(i=>m[i.id]).length; return {d,t:its.length,p:its.length?Math.round(d/its.length*100):0}; }
function ckDefaultKey(C){
  if(C.period==="once") return "once";
  const td=tdNum(); let k=ckKey(C,td);
  if(C.period==="daily"&&C.workdays&&wdOf(td)>4) k=ckNext(C,k,-1);
  const pk=ckNext(C,k,-1);
  if(ckValid(C,pk)){ const pr=ckProg(C,pk); if(pr.d<pr.t && ckDeadline(C,pk)>=td) return pk; }
  return k;
}
function ckState(C,key){
  const pr=ckProg(C,key); const dl=ckDeadline(C,key); const td=tdNum();
  if(pr.t&&pr.d>=pr.t) return {cls:"ok",t:"Бажарилди"};
  if(dl==null) return {cls:"act",t:"Жараёнда"};
  const left=dl-td;
  if(left<0) return {cls:"bad",t:"Муддати ўтди ("+(-left)+" кун)"};
  if(left===0) return {cls:"soon",t:"Бугун муддат"};
  if(left<=(+C.remind||0)) return {cls:"soon",t:left+" кун қолди"};
  return {cls:"act",t:left+" кун қолди"};
}
function ckAlerts(f){
  const out=[]; const td=tdNum();
  firmChecks(f.id).forEach(C=>{
    if(C.paused||!(C.items||[]).length) return;
    const keys=[]; if(C.period==="once") keys.push("once"); else { let k=ckKey(C,td); if(C.period==="daily"&&C.workdays&&wdOf(td)>4) k=ckNext(C,k,-1); keys.push(k); for(let i=0;i<3;i++){ k=ckNext(C,k,-1); keys.push(k); } }
    keys.forEach((k,i)=>{
      if(!ckValid(C,k)) return; const pr=ckProg(C,k); if(pr.d>=pr.t) return;
      const dl=ckDeadline(C,k); if(dl==null) return; const left=dl-td;
      if(C.period==="daily"){ if(i===1) out.push({lvl:"soon",tab:"check",t:`Чек лист «${C.name}» (${ckLabel(C,k)}): тўлиқ бажарилмаган, ${pr.d}/${pr.t}`}); return; }
      if(left<0) out.push({lvl:"bad",tab:"check",t:`Чек лист «${C.name}» (${ckLabel(C,k)}): муддати ${-left} кун ўтди, ${pr.d}/${pr.t} бажарилган`});
      else if(left<=(+C.remind||0)) out.push({lvl:"soon",tab:"check",t:`Чек лист «${C.name}» (${ckLabel(C,k)}): ${left?left+" кундан кейин":"бугун"} муддат (${fmtDate(d2iso(dl))}), ${pr.d}/${pr.t} бажарилган`});
    });
  });
  return out;
}
function ckRing(p,c,l,size=64){
  const r=26, L=2*Math.PI*r, off=L*(1-p/100);
  return `<svg class="ckring" viewBox="0 0 64 64" width="${size}" height="${size}" aria-hidden="true" style="--c:${c};--cl:${l}"><circle cx="32" cy="32" r="${r}" fill="none" stroke="rgba(140,170,255,.18)" stroke-width="6"/><circle cx="32" cy="32" r="${r}" fill="none" stroke="${l}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${L.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}" transform="rotate(-90 32 32)" style="filter:drop-shadow(0 0 4px ${c})"/><text x="32" y="37" text-anchor="middle" font-size="15" font-weight="700" font-style="italic" fill="${l}" font-family="Unbounded,Golos Text,sans-serif">${p}%</text></svg>`;
}
function ckDueText(C){
  switch(C.period){
    case "daily": return C.workdays?"иш кунлари (Ду–Жу)":"ҳар куни";
    case "weekly": return "муддат: ҳар "+WD[C.dueWd===""||C.dueWd==null?4:+C.dueWd].toLowerCase();
    case "monthly": return "муддат: "+(C.dueNext?"кейинги ойнинг ":"шу ойнинг ")+(parseInt(C.dueDay)?parseInt(C.dueDay)+"-куни":"охирги куни");
    case "quarterly": return "муддат: "+(C.dueNext?"чоракдан кейинги ойнинг ":"чорак охирги ойининг ")+(parseInt(C.dueDay)?parseInt(C.dueDay)+"-куни":"охирги куни");
    case "yearly": return "муддат: "+(C.dueNext?"кейинги йил ":"")+(parseInt(C.dueDay)||"охирги")+" "+MONTHS_UZ[(parseInt(C.dueMonth)||12)-1].toLowerCase();
    default: return C.dueDate?"муддат: "+fmtDate(C.dueDate):"";
  }
}

  const cnt=(re)=>(low.match(re)||[]).length;

  const goods=cnt(/товар|поставк|продукц|тмц|маҳсулот|mahsulot|tovar|купли-продажи|oldi-sotdi|олди-сотди|техник|оборудован|ускуна/g)+3*(/(поставк|купли|oldi-sotdi|олди-сотди|товар|етказиб бериш)/.test(titleL)?1:0);
  const serv=cnt(/услуг|работ|хизмат|xizmat|аренд|ижара|ijara|подряд|консалт|перевоз|ish bajar|иш бажар|транспорт/g)+3*(/(услуг|хизмат|xizmat|аренд|ижара|ijara|подряд|работ)/.test(titleL)?1:0);
  if(goods||serv) set("subj",goods>serv?"товар":"хизмат");
  m=/(?:предмет договора|предмет контракта|шартнома предмети|shartnoma predmeti|шартноманинг предмети)\s*[.:]?\s*(?:\d+(?:\.\d+)*\.?\s*)?/i.exec(t);
  if(m){ let sj=t.slice(m.index+m[0].length,m.index+m[0].length+400).replace(/\s*\n\s*/g," "); const cut=/\.\s+(?=\d+\.|[А-ЯЎҚҒҲA-Z]{3,})/.exec(sj); if(cut) sj=sj.slice(0,cut.index+1); sj=sj.trim().slice(0,260); if(sj.length>=10) set("subject",sj); }
  // amount + currency
  const kw=/(?:общая сумма|сумма договора|сумма контракта|цена договора|стоимость|сумма|умумий суммаси|шартнома суммаси|суммаси|umumiy summasi|shartnoma summasi|summasi|қиймати|qiymati|жами)/gi;
  let best=null;
  while((m=kw.exec(t))){ const w=t.slice(m.index+m[0].length,m.index+m[0].length+160); const nm=/(\d{1,3}(?:[ .,']\d{3})+(?:[.,]\d{1,2})?|\d{4,}(?:[.,]\d{1,2})?)/.exec(w); if(!nm) continue;
    const v=ctNum(nm[1]); if(v<1000) continue; const tail=w.slice(nm.index+nm[0].length).toLowerCase().slice(0,260);
    if(/^\s*%/.test(tail)) continue;
    let cur="UZS"; const cm=/(сум|сўм|so['ʻ‘’]?m|uzs|руб|rub|usd|долл|\$|евро|eur|юан|cny)/.exec(tail); if(cm){ const c=cm[1]; cur=/руб|rub/.test(c)?"RUB":/usd|долл|\$/.test(c)?"USD":/евро|eur/.test(c)?"EUR":/юан|cny/.test(c)?"CNY":"UZS"; }
    if(!best||v>best.v) best={v,cur}; }
  if(best){ set("amount",String(best.v)); set("currency",best.cur); }
  // counterparty requisites near its INN
  if(cpInn){
    let w=t.slice(Math.max(0,cpInn.idx-700),cpInn.idx+500);
    const reqOrg=orgs.filter(o=>o.idx<cpInn.idx&&cpInn.idx-o.idx<700&&ctCore(o.name)===ctCore(cpOrg?.name)).pop();
    if(reqOrg){ const nxt=orgs.find(o=>o.idx>cpInn.idx&&ctCore(o.name)!==ctCore(cpOrg?.name)); w=t.slice(reqOrg.idx, Math.min(nxt?nxt.idx:Infinity, cpInn.idx+260)); }
    const ourAcc=new Set((firm?.accounts||[]).map(a=>a.num));
    const accs=[...w.matchAll(/(?<!\d)(\d{20})(?!\d)/g)].map(x=>x[1]).filter(a=>!ourAcc.has(a)); if(accs.length) set("cp.account",accs[accs.length>1?accs.length-1:0]);
    const mfos=[...w.matchAll(/(?:МФО|MFO|БИК)\s*[:№]?\s*(\d{5})(?!\d)/gi)].map(x=>x[1]).filter(x=>!(firm?.accounts||[]).some(a=>a.mfo===x)); if(mfos.length) set("cp.mfo",mfos[mfos.length-1]);
    const ad=[...w.matchAll(/(?:юр\.?\s*адрес|адрес|манзил|manzil|юридик манзил|yuridik manzil)\s*[:\-]?\s*([^]{5,160}?)(?=\n\s*(?:р\/с|ҳ\/р|h\/r|х\/р|в\s|ИНН|СТИР|STIR|МФО|MFO|тел|tel|[«"“]|\d{20})|\s(?:ИНН|СТИР|STIR|р\/с|ҳ\/р|h\/r|тел|tel|МФО|MFO)\s|$)/gi)].map(x=>x[1].replace(/\s*\n\s*/g," ").split(/\s(?:Адрес|Манзил|Manzil)\s*:/i)[0].trim().replace(/[,;]$/,""));
    const ourAddr=ctLat(firm?.address||"").slice(0,15);
    const adr=ad.filter(a=>!ourAddr||!ctLat(a).includes(ourAddr)).pop(); if(adr) set("cp.address",adr);
    const ourBanks=(firm?.accounts||[]).map(a=>ctLat(a.bank||"")).filter(Boolean);
    const bl=w.split("\n").map(l=>l.trim()).filter(l=>/(?:^|[\s«"“(])(?:банк|bank|акб|атб|akb|atb)/i.test(l)&&!/именуем|деб аталади|keyingi/i.test(l));
    const bkl=bl.map(l=>l.replace(/.*?(?:р\/с|ҳ\/р|h\/r|х\/р)\s*\d{20}\s*,?\s*/i,"").replace(/^(?:в|in)\s+/i,"").replace(/,?\s*(?:МФО|MFO|БИК)\s*[:№]?\s*(?:\d{5}.*)?$/i,"").replace(/,?\s*(?:ИНН|СТИР|STIR).*$/i,"").trim()).filter(l=>l.length>2&&!ourBanks.some(b=>b&&ctLat(l).includes(b)));
    if(bkl.length) set("cp.bank",bkl[bkl.length-1].slice(0,80));
    const ph=/(\+?998[\s\-()]*\d{2}[\s\-()]*\d{3}[\s\-]*\d{2}[\s\-]*\d{2})/.exec(w); if(ph&&!String(firm?.phone||"").replace(/\D/g,"").endsWith(ph[1].replace(/\D/g,"").slice(-7))) set("cp.phone",ph[1].trim());
  }
  if(cpOrg){ // director: "в лице директора X" / "директор X шахсида" after any mention of cp
    const cc=ctCore(cpOrg.name);
    for(const o of orgs.filter(o=>ctCore(o.name)===cc)){
      const w=t.slice(o.idx,o.idx+320);
      const dm=/(?:в лице(?: генерального)? директора|[Дд]иректор|[Dd]irektor|[Рр]аҳбар|[Rr]ahbar)[\s_:]+([А-ЯЁЎҚҒҲA-Z][а-яёўқғҳa-z‘'ʻ’]+(?:\s+[А-ЯЁЎҚҒҲA-Z]\.\s?[А-ЯЁЎҚҒҲA-Z]\.?)?)/.exec(w);
      if(dm){ set("cp.director",dm[1].replace(/\s+/g," ").trim()); break; }
    }
  }
  return {d,auto};
}

/* PDF -> text: lines by y; side-by-side table columns are read column by column */
function ctLayout(pages){
  const out=[];
  pages.forEach(({items,width})=>{
    const rows=[];
    items.forEach(it=>{ if(!it.str||!it.str.trim()) return; const y=it.transform[5], x=it.transform[4]; let r=rows.find(r=>Math.abs(r.y-y)<=2.5); if(!r){ r={y,items:[]}; rows.push(r);} r.items.push({x,w:it.width||0,s:it.str}); });
    rows.sort((a,b)=>b.y-a.y);
    const mid=(width||600)/2; let tbl=null;
    const flush=()=>{ if(!tbl) return; out.push(...tbl.L, ...tbl.R); tbl=null; };
    rows.forEach(r=>{
      r.items.sort((a,b)=>a.x-b.x);
      const segs=[]; let cur=null, px=null;
      r.items.forEach(i=>{ if(px!==null&&i.x-px>24){ segs.push(cur); cur=null; } if(!cur) cur={x:i.x,s:""}; else if(i.x-px>1.5&&!/\s$/.test(cur.s)&&!/^\s/.test(i.s)) cur.s+=" "; cur.s+=i.s; px=i.x+i.w; });
      if(cur) segs.push(cur);
      const clean=segs.map(g=>({x:g.x,s:g.s.replace(/\s+/g," ").trim()})).filter(g=>g.s);
      const isTbl=clean.length>1||(clean.length===1&&clean[0].x>mid-20);
      if(!isTbl){ flush(); out.push(clean.map(g=>g.s).join(" ")); return; }
      if(!tbl) tbl={L:[],R:[]};
      clean.forEach(g=>(g.x<mid-20?tbl.L:tbl.R).push(g.s));
    });
    flush();
  });
  return out.join("\n");
}

/* OCR: сканер қилинган PDF (расм) дан матн — tesseract.js, рус + ўзбек (кирилл, лотин) */
const TESS_V="5.1.1";
let OCR_W=null, OCR_LOG=null;
async function ocrWorker(){
  if(!window.Tesseract) await loadScript(`https://cdn.jsdelivr.net/npm/tesseract.js@${TESS_V}/dist/tesseract.min.js`);
  if(!OCR_W) OCR_W=Tesseract.createWorker(["rus","uzb_cyrl","uzb"],1,{logger:m=>{ if(OCR_LOG) OCR_LOG(m); }}).catch(e=>{ OCR_W=null; throw e; });
  return OCR_W;
}
async function pdfOcr(file,onP){
  await ensurePdfjs();
  const doc=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  const n=Math.min(doc.numPages,6); const out=[];
  OCR_LOG=m=>{ if(m.status==="recognizing text") return; onP&&onP((m.status==="loading language traineddata"?"тил маълумотлари юкланмоқда (фақат биринчи марта)":"OCR тайёрланмоқда")+(m.progress?" "+Math.round(m.progress*100)+"%":"")); };
  const w=await ocrWorker();
  for(let p=1;p<=n;p++){
    onP&&onP(`${p}/${n}-бет ўқилмоқда (OCR)…`);
    const pg=await doc.getPage(p); const vp=pg.getViewport({scale:2.2});
    const c=document.createElement("canvas"); c.width=Math.floor(vp.width); c.height=Math.floor(vp.height);
    await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
    const r=await w.recognize(c); out.push(r.data.text||"");
  }
  OCR_LOG=null;
  return {text:out.join("\n").replace(/[ \t]+\n/g,"\n"),pages:doc.numPages};
}
/* PDF -> matn */
const PDFJS_V="3.11.174", PDFJS_URL=`https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_V}/pdf.min.js`, PDFJS_WORKER=`https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_V}/pdf.worker.min.js`;
async function ensurePdfjs(){
  if(!window.pdfjsLib) await loadScript(PDFJS_URL);
  if(!ensurePdfjs._w){ try{ const code=await (await fetch(PDFJS_WORKER)).text(); pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([code],{type:"text/javascript"})); }catch(e){ pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_WORKER; } ensurePdfjs._w=1; }
}
async function pdfToText(file){
  await ensurePdfjs();
  const doc=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise; const pages=[];
  for(let p=1;p<=Math.min(doc.numPages,15);p++){ const pg=await doc.getPage(p); const vp=pg.getViewport({scale:1}); const tc=await pg.getTextContent(); pages.push({items:tc.items,width:vp.width}); }
  return {text:ctLayout(pages),pages:doc.numPages};
}

function ctApplyParsed(d,p,onlyEmpty){
  const auto=new Set();
  Object.entries(p.d).forEach(([k,v])=>{ if(onlyEmpty&&getPath(d,k)) return; setPath(d,k,v); auto.add(k); });

async function ctReadFiles(files){
  const f=firm(V.firmId); if(!f) return;
  const list=[...files].filter(x=>/\.pdf$/i.test(x.name)||x.type==="application/pdf");
  if(!list.length){ toast("Фақат PDF файллар юкланади"); return; }
  V.ctImport={items:list.map(x=>({id:uid(),file:x,fname:x.name,size:x.size,status:"read",url:URL.createObjectURL(x),auto:new Set(),d:null})),saving:false};
  V.ctId=null; V.ctEdit=null; render(); window.scrollTo(0,0);
  for(const it of V.ctImport.items){
    if(!V.ctImport) return;
    const d=ctNewDraft(f.id);
    if(it.size>25*1024*1024){ it.status="err"; it.msg="Файл 25 МБ дан катта"; it.d=null; render(); continue; }
    try{ const r=await pdfToText(it.file); it.pages=r.pages;
      let text=r.text;
      if(text.replace(/\s/g,"").length<40){
        it.status="ocr"; it.msg2="сканер қилинган PDF — матн танилмоқда…"; render();
        try{ const o=await pdfOcr(it.file,m=>{ it.msg2=m; const el=document.querySelector(`[data-impid="${it.id}"] .ocrp`); if(el) el.textContent=m; }); text=o.text; it.ocr=true; }
        catch(e){ text=""; it.msg="OCR ишламади: "+(e?.message||e)+". Маълумотни қўлда киритинг."; }
      }
      if(text.replace(/\s/g,"").length<40){ it.status="scan"; it.d=d; }
      else{ const p=ctParse(text,f); it.auto=ctApplyParsed(d,p,false); it.d=d; it.status="ok"; }
    }catch(e){ it.status="err"; it.msg="PDF'ни ўқиб бўлмади: "+(e?.message||e); it.d=d; }
    if(V.ctImport&&V.tab==="contracts") render();
  }
}
/* Google Drive: PDF nusxasini saqlash */
const DRIVE="https://www.googleapis.com/drive/v3/files", DRIVE_UP="https://www.googleapis.com/upload/drive/v3/files";
async function driveFolderId(){
  const lk="fb-pdf-dir-"+DB_ID+"-"+ME.email; let id=ls.get(lk);
  if(id){ try{ const r=await api("GET",`${DRIVE}/${id}?fields=id,trashed`); if(!r.trashed) return id; }catch(e){ if(e instanceof AuthErr) throw e; } }
  const q=encodeURIComponent(`mimeType='application/vnd.google-apps.folder' and trashed=false and appProperties has { key='fbdb' and value='${DB_ID}' }`);
  const r=await api("GET",`${DRIVE}?q=${q}&fields=files(id,name)&spaces=drive`);
  id=r.files?.[0]?.id;
  if(!id){ const c=await api("POST",`${DRIVE}?fields=id`,{name:"Фирмалар базаси — шартномалар (PDF)",mimeType:"application/vnd.google-apps.folder",appProperties:{fbdb:DB_ID}}); id=c.id; }
  ls.set(lk,id); return id;
}
const SHARE_SYNC={};
async function driveShareWithBase(fileId){
  if(SHARE_SYNC[fileId]) return; SHARE_SYNC[fileId]=1;
  try{
    const sp=await api("GET",`${DRIVE}/${DB_ID}/permissions?fields=permissions(emailAddress,type,role)`);
    const fp=await api("GET",`${DRIVE}/${fileId}/permissions?fields=permissions(emailAddress,type,role)`);
    const have=new Set((fp.permissions||[]).map(p=>(p.emailAddress||"").toLowerCase()));
    for(const p of (sp.permissions||[])){ if(p.type!=="user"||!p.emailAddress||have.has(p.emailAddress.toLowerCase())) continue;
      try{ await api("POST",`${DRIVE}/${fileId}/permissions?sendNotificationEmail=false&fields=id`,{type:"user",role:"reader",emailAddress:p.emailAddress}); }catch(e){} }
  }catch(e){ SHARE_SYNC[fileId]=0; }
}
async function driveUpload(file,name){
  if(DEMO){ const id="demo-"+uid(); DEMO_FILES[id]=URL.createObjectURL(file); return {id,name,size:file.size,demo:true,by:ME.email,at:Date.now()}; }
  const folder=await driveFolderId(); await driveShareWithBase(folder);
  if(!TOKEN||Date.now()>TOKEN_EXP){ needAuth(); throw new AuthErr("Сессия тугаган"); }
  const meta={name,parents:[folder],mimeType:"application/pdf",appProperties:{fbdb:DB_ID}};
  let r;
  try{
    if(file.size<=4.5*1024*1024){
      const b="fb"+uid();
      const body=new Blob([`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: application/pdf\r\n\r\n`,file,`\r\n--${b}--`]);
      r=await fetch(`${DRIVE_UP}?uploadType=multipart&fields=id,name,size,webViewLink`,{method:"POST",headers:{Authorization:"Bearer "+TOKEN,"Content-Type":"multipart/related; boundary="+b},body});
    }else{
      const s0=await fetch(`${DRIVE_UP}?uploadType=resumable&fields=id,name,size,webViewLink`,{method:"POST",headers:{Authorization:"Bearer "+TOKEN,"Content-Type":"application/json; charset=UTF-8","X-Upload-Content-Type":"application/pdf"},body:JSON.stringify(meta)});
      if(s0.status===401){ TOKEN=null; needAuth(); throw new AuthErr("Сессия тугаган"); }
      const loc=s0.ok&&s0.headers.get("Location"); if(!loc) throw new Error("Катта файлни юклаб бўлмади ("+s0.status+")");
      r=await fetch(loc,{method:"PUT",headers:{"Content-Type":"application/pdf"},body:file});
    }
  }catch(e){ if(e instanceof AuthErr) throw e; throw new Error(e?.message&&!/fetch/i.test(e.message)?e.message:"Интернет алоқаси йўқ"); }
  if(r.status===401){ TOKEN=null; needAuth(); throw new AuthErr("Сессия тугаган"); }
  if(!r.ok){ let m=""; try{ m=(await r.json()).error?.message||""; }catch(e){} throw new Error("PDF Drive'га юкланмади: "+(m||r.status)); }
  const j=await r.json();
  return {id:j.id,name:j.name||name,size:+j.size||file.size,link:j.webViewLink||`https://drive.google.com/file/d/${j.id}/view`,by:ME.email,at:Date.now()};
}

/* ---------- Контрагентлар маълумотномаси (барча фирмалар бўйича) ---------- */
function cpIndex(){
  const map=new Map();
  S.recs.filter(r=>r.type==="contract"&&r.cp&&(r.cp.name||r.cp.inn)&&firm(r.firmId)).forEach(c=>{
    const key=c.cp.inn?("i"+c.cp.inn):("n"+ctCore(c.cp.name));
    let e=map.get(key); if(!e){ e={key,cp:{},list:[]}; map.set(key,e); } e.list.push(c);
  });
  const byCore=new Map(); map.forEach(e=>{ if(e.key[0]==="i") e.list.forEach(c=>{ const k=ctCore(c.cp.name); if(k&&!byCore.has(k)) byCore.set(k,e); }); });
  map.forEach((e,k)=>{ if(k[0]==="n"){ const t=byCore.get(k.slice(1)); if(t){ t.list.push(...e.list); map.delete(k); } } });
  const td=tdNum();
  return [...map.values()].map(e=>{
    e.list.sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.createdAt||0)-(a.createdAt||0));
    e.list.forEach(c=>Object.entries(c.cp||{}).forEach(([k,v])=>{ if(v&&!e.cp[k]) e.cp[k]=v; }));
    e.firms=[...new Set(e.list.map(c=>c.firmId))];
    e.inN=e.list.filter(c=>(c.dir||"in")==="in").length; e.outN=e.list.length-e.inN;
    e.open=e.list.filter(c=>c.status!=="closed");
    e.sums={}; e.open.forEach(c=>{ const k=c.currency||"UZS"; e.sums[k]=(e.sums[k]||0)+num(c.amount); });
    e.last=e.list[0]?.date||"";
    e.warn=e.open.some(c=>{ const x=dnum(c.endDate); return x!=null&&x-td<=30; });
    return e;
  }).sort((a,b)=>(b.last||"").localeCompare(a.last||"")||(a.cp.name||"").localeCompare(b.cp.name||""));
}
const cpSumTxt=sums=>Object.entries(sums).filter(([,v])=>v).map(([k,v])=>m0(v)+" "+(k==="UZS"?"сўм":k)).join(" + ")||"—";

    <td class="num">${e.inN?`<span class="cpn in" title="кирувчи">↓ ${e.inN}</span>`:""}${e.outN?`<span class="cpn out" title="чиқувчи">↑ ${e.outN}</span>`:""}</td>
    <td class="num r">${esc(cpSumTxt(e.sums))}</td><td class="num">${fmtDate(e.last)}</td></tr>`).join("")}

  const desc=s=>gStr(String(s||"").replace(/^\s*\d+:\s*1\.\s*/,"").split(/\n|2\. Всего мест/)[0]).slice(0,180);
  const items=[];
  if(g("g33")) items.push({n:+g("g32")||1,hs:g("g33"),desc:desc(F.g31name),brutto:gNum(F.g35),netto:gNum(F.g38),qty:g("eq"),inv:gNum(F.g42),cv:gNum(F.g45)});
  for(let i=0;i<3;i++){ if(g("g33"+i)) items.push({n:+g("g32"+i)||items.length+1,hs:g("g33"+i),desc:desc(F["g31"+i]),brutto:gNum(F["g35"+i]),netto:gNum(F["g38"+i]),qty:g("eq"+i),inv:gNum(F["g42"+i]),cv:gNum(F["g45"+i])}); }

  while((x=rd.exec(docsTxt))){ const dd={code:x[1],no:gStr(x[3]),date:gDate(x[4])}; if(!docs.some(o=>o.code===dd.code&&o.no===dd.no)) docs.push(dd); }
  const kn=docs.find(d=>d.code==="301");
  const inv=[...new Set(docs.filter(d=>d.code==="220").map(d=>d.no))];
  const cur=g("g22a"); const curL=CURRENCIES[cur]||cur;
  return {
    no:`${m[1]}/${m[2]}/${m[3]}`, post:m[1], date:gDate(m[2]), num:m[3], form:g("number"), regime, isEx,
    inn:isEx?gInn(F.g2code2||F.g2code1):gInn(F.g8code2||F.g9code2||F.g31code),
    sender:{name:g("g2name"),addr:gStr([F.g2address,F.g2add].filter(Boolean).join(", ")),inn:gInn(F.g2code2)},
    recipient:{name:g("g8name")||g("g8address"),addr:g("g8add"),inn:gInn(F.g8code2)},
    declarant:{name:g("g14name"),inn:g("g14code1")},
    country:g("g15name")||g("g16name"), terms:(g("g20b")+" "+g("g20name")).trim(),
    currency:curL, invoice:gNum(F.g22b), rate, cv, cvSum,
    nItems, items, partial:items.length<nItems,
    brutto:items.reduce((a,b)=>a+b.brutto,0), netto:items.reduce((a,b)=>a+b.netto,0),
    pay, payTotal, contract:kn?{no:kn.no,date:kn.date}:null, invoices:inv,
    release:gDate(F.gdvipdate), post29:g("g29name"),
  };
}

async function gtdReadFiles(files,firmId){
  await ensureGtd();
  const list=[...files].filter(x=>/\.pdf$/i.test(x.name)||x.type==="application/pdf");
  if(!list.length){ toast("Фақат PDF файллар юкланади"); return; }
  V.gImport={items:list.map(x=>({id:uid(),file:x,fname:x.name,size:x.size,status:"read",d:null,firmId:firmId||""})),saving:false,firmId:firmId||""};
  V.gId=null; render(); window.scrollTo(0,0);
  const seen=new Set();
  for(const it of V.gImport.items){
    if(!V.gImport) return;
    try{
      const {F}=await gtdFields(it.file); const d=gtdParse(F);
      if(!d){ it.status="err"; it.msg="ГТД майдонлари топилмади (сканер ёки бошқа ҳужжат)"; }
      else{ it.d=d;
        const fm=firmByInn(d.inn); if(!it.firmId) it.firmId=fm?.id||""; if(firmId&&fm&&fm.id!==firmId) it.warn=`Бу ГТД бошқа фирмага тегишли (${fm.name}) — шу фирмага сақланади`;
        if(S.gtd.some(r=>r.no===d.no)){ it.status="dup"; it.msg="Бу ГТД аллақачон реестрда бор"; }
        else if(seen.has(d.no)){ it.status="dup"; it.msg="Бу файл рўйхатда икки марта танланган"; }
        else it.status=it.firmId?"ok":"nofirm";
        seen.add(d.no);
      }
    }catch(e){ it.status="err"; it.msg="PDF'ни ўқиб бўлмади: "+(e?.message||e); }
    if(V.gImport) gtdImpRefresh();
  }
}

/* ---------- Солиқ рейтинги: chamber.uz дан автомат олиш ---------- */
const RATING_API="https://admin.chamber.uz/api/GetCompanyCriteries/";
const RATING_LK="fb-rating-day";
const latCat=c=>String(c||"").trim().toUpperCase().replace(/А/g,"A").replace(/В/g,"B").replace(/С/g,"C").replace(/Д/g,"D");
async function fetchRating(inn){
  inn=String(inn||"").trim(); if(!/^\d{9}$/.test(inn)) return null;
  let r; try{ r=await fetch(RATING_API+inn,{cache:"no-store"}); }catch(e){ throw new Error("chamber.uz га уланиб бўлмади"); }
  if(r.status===404) return null;
  if(!r.ok) throw new Error("chamber.uz жавоб бермади ("+r.status+")");
  let j; try{ j=await r.json(); }catch(e){ return null; }
  const cat=latCat(j?.type); if(!/^(AAA|AA|A|BBB|BB|B|CCC|CC|C|D)$/.test(cat)) return null;
  return {cat,score:j.criteriaAll!=null?String(j.criteriaAll):"",name:j.nameUz||j.name||""};
}
async function applyRating(fid,rt){
  for(let attempt=0;attempt<2;attempt++){
    const f=firm(fid); if(!f) return false;
    if(f.ratingCat===rt.cat&&String(f.ratingScore||"")===rt.score) return false;
    const o=JSON.parse(JSON.stringify(f)); const prev=(f.ratingCat||"—")+(f.ratingScore?" ("+f.ratingScore+")":"");
    o.ratingCat=rt.cat; o.ratingScore=rt.score; o.ratingDate=localToday();
    o.ratingHist=(o.ratingHist||[]).concat([{d:localToday(),cat:rt.cat,score:rt.score}]).slice(-24);
    try{ await putItem("firms",o,`Солиқ рейтинги: ${prev} → ${rt.cat} (${rt.score} балл), chamber.uz`); return true; }
    catch(err){ if(err instanceof ConflictErr&&attempt===0) continue; throw err; }
  }
  return false;
}
let RATING_RUN=null;
async function refreshRatings(opts={}){
  if(RATING_RUN) return RATING_RUN;
  RATING_RUN=(async()=>{
    const list=S.firms.filter(f=>/^\d{9}$/.test(String(f.inn||"").trim())); let changed=[], fail=0, nf=0;
    for(const f of list){
      try{ const rt=await fetchRating(f.inn); if(!rt){ nf++; continue; } const was=f.ratingCat; if(await applyRating(f.id,rt)) changed.push(`${f.name}: ${was||"—"} → ${rt.cat}`); }
      catch(e){ fail++; if(e instanceof AuthErr) break; }
      await new Promise(ok=>setTimeout(ok,250));
    }
    ls.set(RATING_LK,localToday());
    if(changed.length) render();
    if(!opts.silent||changed.length) toast(changed.length?`Рейтинг ўзгарди: ${changed.slice(0,3).join("; ")}${changed.length>3?" ва яна "+(changed.length-3)+" та":""}`:`Рейтинглар текширилди (${list.length-fail-nf} та фирма) — ўзгариш йўқ${fail?", "+fail+" тасида хато":""}`);
    return {changed,fail,nf};
  })();
  try{ return await RATING_RUN; }finally{ RATING_RUN=null; }
}
function ratingAuto(){ if(DEMO) return; if(ls.get(RATING_LK)===localToday()) return; setTimeout(()=>{ if(S.ready&&S.firms.length) refreshRatings({silent:true}).catch(()=>{}); },4000); }
