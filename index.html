const CH_HOMO={"А":"A","В":"B","С":"C","Е":"E","Н":"H","К":"K","М":"M","О":"O","Р":"P","Т":"T","Х":"X","У":"Y","а":"a","е":"e","о":"o","р":"p","с":"c","х":"x","у":"y"};
const chLatFix=s=>{ s=String(s||""); const ws=s.split(/\s+/).filter(Boolean); const latW=ws.filter(w=>/[A-Za-z]{2}/.test(w)&&!/[А-Яа-яЁёЎўҚқҒғҲҳ]/.test(w)).length; if(latW&&ws.every(w=>!/[А-Яа-яЁёЎўҚқҒғҲҳ]/.test(w.replace(/[АВСЕНКМОРТХУаеорсху]/g,"")))) return s.replace(/[АВСЕНКМОРТХУаеорсху]/g,c=>CH_HOMO[c]); return s.split(/(\s+)/).map(w=>{ const lat=(w.match(/[A-Za-z]/g)||[]).length, cyr=(w.match(/[А-Яа-яЁёЎўҚқҒғҲҳ]/g)||[]).length; return lat&&cyr&&lat>=cyr?w.replace(/[АВСЕНКМОРТХУаеорсху]/g,c=>CH_HOMO[c]):w; }).join(""); };
const chNorm=s=>chLatFix(String(s||"").toUpperCase()).replace(/[АВСЕНКМОРТХУ]/g,c=>CH_HOMO[c]).replace(/[^A-Z0-9А-ЯЁЎҚҒҲ]/g,"");
function chSim(a,b){ a=chNorm(a); b=chNorm(b); if(!a||!b) return 0; if(a===b) return 1; const m=a.length, n=b.length; let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; } return 1-prev[n]/Math.max(m,n); }
const latScore=s=>{ const w=String(s).split(/\s+/).filter(Boolean); const L=w.filter(x=>/[A-Za-z]/.test(x)&&!/[А-Яа-яЎўҚқҒғҲҳ]/.test(x)).length, C=w.filter(x=>/[А-Яа-яЎўҚқҒғҲҳ]/.test(x)&&!/[A-Za-z]/.test(x)).length; return Math.max(L,C)/(w.length||1)-((s.match(/["'’`]/g)||[]).length*.05); };
const UZ_MONTHS=[/^январ/i,/^феврал/i,/^март/i,/^апрел/i,/^май/i,/^июн/i,/^июл/i,/^август/i,/^сентябр/i,/^октябр/i,/^ноябр/i,/^декабр/i];
function chParse(text,f){
  const T=text.replace(/ /g," ").replace(/\r/g,""); const d={}; let n=0; const set=(k,v)=>{ v=String(v||"").replace(/\s+/g," ").trim(); if(v&&!d[k]){ d[k]=v; n++; } };
  const head=T.slice(0,2500);
  d.kind=/таъсис\s+шартномаси|учредительный\s+договор/i.test(head)&&!/\bустав/i.test(head.slice(0,800))?"Таъсис шартномаси":"Устав";
  const ed=T.match(/(янги\s+та[ҳх]рир|\d+[-‑]?\s*та[ҳх]рир\S*|в\s+новой\s+редакции|новая\s+редакция)/i); if(ed) set("edition",ed[1][0].toUpperCase()+ed[1].slice(1).toLowerCase());
  /* номи: қўштирноқ ичидаги ном, фирма номи билан солиштириш */
  const cands=[]; const rn=/[«"„]\s*([A-ZА-ЯЁЎҚҒҲ0-9][^«»"“\n]{1,60}?)\s*(?:»|“|"|\s[эу]\b|\))/g; let x;
  while((x=rn.exec(T))&&cands.length<40){ const c=chLatFix(x[1].trim()); if(!/^(конун|[кқ]онун|ТАСД|Жамият(?![А-Яа-яЎўҚқҒғҲҳ])|Устав(?![А-Яа-я]))/i.test(c)&&c.length>=2) cands.push(c); }
  let short=""; const fq=String(f?.name||"").match(/[«"„]([^»"“]+)[»"“]/); const fName=fq?fq[1].trim():String(f?.name||"").replace(/\s*(МЧЖ|ООО|АЖ|ХК|ОК)\s*$/i,"").trim();
  if(fName&&cands.some(c=>chSim(c,fName)>=.6)) short=fName;
  else if(cands.length){ const cnt={}; cands.forEach(c=>{ const k=chNorm(c); cnt[k]=cnt[k]||{c,n:0,s:latScore(c)}; cnt[k].n++; }); short=Object.values(cnt).sort((a,b)=>b.n-a.n||b.s-a.s)[0].c; }
  const formTxt=T.match(/масъулияти\s+чекланган\s+жамият|акциядорлик\s+жамият|хусусий\s+корхона|оилавий\s+корхона|общество\s+с\s+ограниченной/i);
  const form=formTxt?(/масъулияти|ограниченной/i.test(formTxt[0])?"МЧЖ":/акциядорлик/i.test(formTxt[0])?"АЖ":/хусусий/i.test(formTxt[0])?"ХК":"ОК"):"";
  if(short){ set("shortName","«"+short+"» "+form); set("name","«"+short+"» "+({МЧЖ:"масъулияти чекланган жамияти",АЖ:"акциядорлик жамияти",ХК:"хусусий корхонаси",ОК:"оилавий корхонаси"}[form]||"")); }
  if(form) set("form",form);
  /* тасдиқланган сана ва қарор */
  const ap=head.match(/(\d{4})\s*йил\S*\s*[«"(]?\s*(\d{1,2})\s*[»"уэ)]?\s*((?:январ|феврал|март|апрел|май|июн|июл|август|сентябр|октябр|ноябр|декабр)[А-Яа-яЎўҚқҒғҲҳ]*)/i);
  if(ap){ const mi=UZ_MONTHS.findIndex(r=>r.test(ap[3])); if(mi>=0) set("approvedDate",`${ap[1]}-${String(mi+1).padStart(2,"0")}-${String(ap[2]).padStart(2,"0")}`); }
  if(!d.approvedDate){ const a2=head.match(/(\d{2}\.\d{2}\.\d{4})[^\n]{0,60}тасди[кқ]лан/i); if(a2) set("approvedDate",gDate(a2[1])); }
  const dec=head.match(/((?:ягона\s+)?(?:таъсисчи|тасисчи|иштирокчи|таъсисчилар\S*\s+умумий\s+йиғилиш|умумий\s+йиғилиш)\S*)[\s\S]{0,80}?([A-ZА-ЯҚ]{0,3}[-‑]?\s*[\d][\d/\-–.]*\d)[-‑]?\s*сонли\s+[кқ]арор/i)||head.match(/(протокол|баённома|[кқ]арор)\S*\s*№\s*(\S+)/i);
  if(dec){ const who=dec[1].toLowerCase().replace("тасисчи","таъсисчи").replace(/сининг|нинг$/,""); set("approvedBy",(who[0].toUpperCase()+who.slice(1))+" қарори № "+dec[2].replace(/\s/g,"")+(d.approvedDate?", "+fmtDate(d.approvedDate):"")); }
  /* рўйхатдан ўтиш */
  const rg=T.match(/(\d{2}[.,]?\s?\d{2}[.,\s]\s?\d{4})\s*йил\S*[\s;,|]*№\s*(\d{4,})[-‑]?\s*сонли\s+реестр/i)||T.match(/(?:давлат\s+рўйхатидан\s+ўтказил\S*|рўйхатга\s+олин\S*)[^\n]{0,60}?(\d{2}[.,]\d{2}[.,]\d{4})[^\n]{0,40}?№\s*(\d{4,})/i);
  if(rg){ const dg=rg[1].replace(/\D/g,""); if(dg.length===8) set("regDate",`${dg.slice(4)}-${dg.slice(2,4)}-${dg.slice(0,2)}`); set("regNo",rg[2]); }
  /* манзил */
  const ad=T.match(/(?:жамият\s+манзили|почта\s+манзили|жойлашган\s+жойи|юридик\s+манзили|местонахождени\S*)\s*[:\-–]\s*([\s\S]{8,240}?)(?=\n\s*\d+[.,]\s*\d+|\n\s*\n\s*\n)/i);
  if(ad) set("address",ad[1].replace(/\s+/g," ").replace(/\s[;|]\s/g," ").replace(/[|Ё]\s*$/,"").replace(/[\s,;|]+$/,""));
  /* устав фонди */
  const cap=T.match(/устав\s*(?:фонди|капитали)[\s\S]{0,260}?(\d{1,3}(?:[ .,]\d{3})+|\d{5,})(?:[.,]\d{1,2})?\s*(?:\([^)]{0,90}\))?\s*(?:сўм|сум)/i);
  if(cap) set("capital",String(Number(cap[1].replace(/[ .,]/g,""))));
  /* таъсисчилар */
  const fo=[]; const rp=/(\d{1,3}(?:[.,]\d{1,4})?)\s*%\s*(?:\(?[^)\n]{0,40}\)?\s*)?(?:яъни|яни|ёки|миқдорида|микдорида)?\s*[-–]?\s*((?:\d{1,3}(?:[ .,]\d{3})+|\d{5,})(?:[.,]\d{1,2})?)?\s*(?:сўм|сум)?/g;
  while((x=rp.exec(T))&&fo.length<15){ const pct=x[1].replace(",","."); if(!(+pct>0&&+pct<=100)) continue;
    const back=T.slice(Math.max(0,x.index-600),x.index); const bm=[...back.matchAll(/(?:^|\n)\s*(?:[•*®·]|[оeе](?=\s)|\d{1,2}[.)]|[-–])\s+/g)]; const seg=bm.length?back.slice(bm[bm.length-1].index+bm[bm.length-1][0].length):back.split("\n").slice(-1)[0];
    let name=seg.split(/\s*[-–—]\s*паспорт|паспорт|ЖШШИР|ПИНФЛ|СТИР|ИНН|\s[-–—]\s|,|\(|\n/i)[0].replace(/[-–—\s:]+$/,"").trim(); name=chLatFix(name);
    if(name.split(/\s+/).length<2||/устав|фонд|капитал|жами|ставк|фоиз|овоз|солиқ|улуш/i.test(name)) continue;
    fo.push({name,pct,sum:x[2]?String(Number(x[2].replace(/[.,]\d{1,2}$/,"").replace(/[ .,]/g,""))):""}); }
  // ягона иштирокчи: исмни 1.3-банддан олиш (OCR бир хил ўқимаслиги мумкин)
  const one=T.match(/ягона\s+(?:иштирокчи|таъсисчи|тасисчи)\S*\s*:\s*(?:[•*®·]|[оeе](?=\s)|[-–])?\s*([^\n]{5,120})/i);
  if(one){ const nm=chLatFix(one[1].split(/\s*[-–—]\s*паспорт|паспорт|ЖШШИР|ПИНФЛ|СТИР|,|\(/i)[0].replace(/[-–—\s:]+$/,"").trim());
    if(nm.split(/\s+/).length>=2){ if(fo.length===1){ if(latScore(nm)>=latScore(fo[0].name)) fo[0].name=nm; } else if(!fo.length) fo.push({name:nm,pct:"100",sum:d.capital||""}); } }
  (f?.founders||[]).forEach(ex=>{ fo.forEach(z=>{ if(chSim(z.name,ex.name)>=.7){ z.name=ex.name; if(ex.pinfl) z.pinfl=ex.pinfl; if(ex.inn) z.inn=ex.inn; } }); });
  const tot=fo.reduce((a,b)=>a+Number(b.pct),0);
  if(fo.length&&Math.abs(tot-100)<0.5){ d.founders=fo.map(z=>({...z,sum:z.sum||(d.capital?String(Math.round(Number(d.capital)*Number(z.pct))/100):"")})); n++; }
  /* ижроия органи */
  const dt=T.match(/ижроия\s+органи\S*\s*[-–—]?\s*(бош\s+директор|директор|раҳбар|рахбар)/i)||T.match(/(бош\s+директор|директор)\S*\s+жамиятнинг\s+ижроия/i);
  if(dt) set("dirTitle",dt[1].replace(/\s+/g," ").replace(/^./,c=>c.toUpperCase()).replace(/ д/," Д"));
  const term=T.match(/(\d{1,2})\s*(?:\([^)]{0,20}\)\s*)?йил\S*\s*му\S{1,5}тга\s*(?:муддатга\s*)?сайлан/i)||T.match(/(\d{1,2})\s*йил\S*\s*муддатга/i);
  if(term) set("dirTerm",term[1]+" йил");
  /* асосий фаолият */
  const act=T.match(/асосий\s+фаолият\s+тури\s*:?\s*\n?\s*([^\n]{5,}(?:\n(?!\s*\n)[^\n;:]{3,})?)/i); if(act) set("activities",act[1].replace(/\s+/g," ").replace(/[;,.\s]+$/,""));
  d.auto=n; return d;
}

async function chApply(fid,cid){
  for(let attempt=0;attempt<2;attempt++){
    const f=firm(fid), c=S.recs.find(x=>x.id===cid); if(!f||!c) return null;
    const o=migrateFirm(f); const ch=[];
    if(c.capital&&String(num(c.capital))!==String(num(o.charterFund))){ o.charterFund=String(num(c.capital)); ch.push("устав фонди"); }
    if(c.address&&c.address!==o.address){ o.address=c.address; ch.push("манзил"); }
    if(c.form&&c.form!==o.form){ o.form=c.form; ch.push("ташкилий шакл"); }
    const fo=(c.founders||[]).filter(x=>x.name); if(fo.length){ o.founders=fo.map(x=>{ const id=digits(x.inn||x.pinfl||x.id); const jur=id.length===9||/МЧЖ|ООО|LLC|жамият|корхона/i.test(x.name); return {kind:jur?"Юридик шахс":"Жисмоний шахс",name:x.name,[jur?"inn":"pinfl"]:id,pct:x.pct||"",sum:x.sum||(o.charterFund?String(Math.round(num(o.charterFund)*num(x.pct))/100):"")}; }); ch.push("таъсисчилар"); }
    o.charter={id:c.id,edition:c.edition||"",approvedDate:c.approvedDate||"",regDate:c.regDate||"",regNo:c.regNo||"",name:c.name||"",dirTitle:c.dirTitle||"",dirTerm:c.dirTerm||""};
    try{ await putItem("firms",o,`Реквизитлар амалдаги уставдан янгиланди${ch.length?": "+ch.join(", "):""}`); return ch; }
    catch(err){ if(err instanceof ConflictErr&&attempt===0) continue; throw err; }
  }
  return null;
}

function fcCalc(c){
  const td=tdNum(); const pDays=+c.prepayDays||180, qDays=+c.postDays||180;
  const ev=[...(c.payments||[]).map(p=>({d:p.date,a:num(p.amount),k:"pay",ref:{no:"Тўлов "+fmtDate(p.date)}})),
    ...fcGtds(c).map(r=>({d:r.release||r.date,a:r.invoice||0,k:"del",ref:{no:"ГТД "+r.no,gid:r.id,cur:r.currency}})),
    ...(c.acts||[]).filter(a=>a.counts).map(a=>({d:a.date,a:num(a.total),k:"del",ref:{no:"Акт № "+(a.no||"")}}))].filter(e=>e.d&&e.a>0).sort((x,y)=>x.d.localeCompare(y.d)||(x.k==="pay"?-1:1));
  const adv=[], debt=[]; let paid=0, del=0;
  ev.forEach(e=>{ let a=e.a; const take=(q)=>{ while(a>0.004&&q.length){ const l=q[0]; const t=Math.min(a,l.a); l.a-=t; a-=t; if(l.a<=0.004) q.shift(); } };
    if(e.k==="pay"){ paid+=a; take(debt); if(a>0.004) adv.push({d:e.d,a,ref:e.ref}); } else { del+=a; take(adv); if(a>0.004) debt.push({d:e.d,a,ref:e.ref}); } });
  const lot=(l,days)=>{ const due=isoAdd(l.d,days); return {...l,due,left:dnum(due)-td}; };
  const A=adv.map(l=>lot(l,pDays)), D=debt.map(l=>lot(l,qDays)); const sum=arr=>arr.reduce((s,x)=>s+x.a,0);
  const curMis=fcGtds(c).some(r=>r.currency&&c.currency&&r.currency!==c.currency);
  return {paid,del,advance:sum(A),debt:sum(D),A,D,overAdv:sum(A.filter(x=>x.left<0)),overDebt:sum(D.filter(x=>x.left<0)),next:[...A,...D].filter(x=>x.left>=0).sort((a,b)=>a.left-b.left)[0]||null,curMis};
}

function fcNums(line){ const greedy=(line.match(/\d{1,3}(?:[  ]\d{3})+(?:[.,]\d+)?|\d+(?:[.,]\d+)?/g)||[]).map(x=>num(x.replace(/[  ]/g,""))); const simple=(line.match(/\d+(?:[.,]\d+)?/g)||[]).map(x=>num(x)); return [greedy,simple]; }
function fcTail3(line){ const tk=String(line).trim().split(/\s+/); const isN=x=>/^\d+(?:[.,]\d+)?$/.test(x);
  const ok=g=>g.length===1||(/^\d{1,3}$/.test(g[0])&&g.slice(1,-1).every(x=>/^\d{3}$/.test(x))&&/^\d{3}(?:[.,]\d+)?$/.test(g[g.length-1]));
  for(let n=3;n<=Math.min(10,tk.length);n++){ const t=tk.slice(-n); if(!isN(t[0])) break;
    for(let a=1;a<=n-2;a++) for(let b=a+1;b<=n-1;b++){ const gs=[t.slice(0,a),t.slice(a,b),t.slice(b)]; if(!gs.every(ok)) continue; const [q,p,s]=gs.map(g=>num(g.join(""))); if(q>0&&p>0&&s>0&&Math.abs(q*p-s)<=Math.max(0.02,s*0.005)) return {q,p,s,start:tk.length-n}; } }
  return null; }
function fcDocParse(text,kind){
  const T=String(text||"").replace(/ /g," "); const d={items:[]}; let n=0;
  const no=T.match(new RegExp((kind==="add"?"(?:қўшимча\\s+келишув\\S*|дополнительное\\s+соглашение|additional\\s+agreement|addendum)":kind==="act"?"(?:акт\\S*|act)":"(?:спецификаци\\S*|specification)")+"\\s*(?:№|No\\.?|N\\s)\\s*([A-Za-zА-Яа-я0-9\\-\\/]+)","i")); if(no){ d.no=no[1]; n++; }
  const dline=T.split("\n").find(l=>/\d{2}[.\/]\d{2}[.\/]\d{4}/.test(l)&&!/контракт|contract|договор|шартнома/i.test(l))||T; const dt=dline.match(/(\d{2})[.\/](\d{2})[.\/](\d{4})/); if(dt){ d.date=`${dt[3]}-${dt[2]}-${dt[1]}`; n++; }
  const cur=T.match(/\b(USD|EUR|RUB|CNY|UZS|KZT|TRY|GBP|CHF|JPY)\b/); if(cur){ d.currency=cur[1]; n++; }
  if(kind!=="add") T.split("\n").forEach(line=>{ if(/итого|всего|жами|total/i.test(line)) return; const r=fcTail3(line); if(!r) return;
      const head=line.trim().split(/\s+/).slice(0,r.start).join(" "); const hs=(head.match(/\b\d{10}\b/)||[])[0]||""; let name=head.replace(hs,"").replace(/^\s*\d{1,3}[.)]?\s+/,"").trim();
      const um=name.match(/\s(шт|дона|кг|kg|pcs|тн|тонна|m2|м2|м²|м3|м³|м|литр|компл\S*|set)\.?$/i); let unit=""; if(um){ unit=um[1]; name=name.slice(0,um.index).trim(); }
      if(name.length>=2) d.items.push({name,hs,unit,qty:String(r.q),price:String(r.p),sum:String(r.s)}); });
  if(d.items.length) n++;
  const tm=T.match(/(?:итого|всего|жами|total)[^\d\n]{0,40}(\d{1,3}(?:[ ]\d{3})+(?:[.,]\d+)?|\d+(?:[.,]\d+)?)/i); if(tm){ d.total=String(num(tm[1].replace(/ /g,""))); n++; } else if(d.items.length) d.total=String(d.items.reduce((a,x)=>a+num(x.sum),0));
  if(kind==="add"){ const am=T.match(/(?:сумм\S*\s+контракта|контракт\s+суммаси|total\s+amount)[^\d\n]{0,60}(\d{1,3}(?:[ ]\d{3})+(?:[.,]\d+)?|\d{4,}(?:[.,]\d+)?)/i); if(am){ d.newAmount=String(num(am[1].replace(/ /g,""))); n++; }
    const en=T.match(/(?:срок\s+действия|амал\s+қилиш\s+муддати|valid\s+until)[^\n]{0,60}?(\d{2})[.\/](\d{2})[.\/](\d{4})/i); if(en){ d.newEnd=`${en[3]}-${en[2]}-${en[1]}`; n++; }
    const body=T.replace(/\s+/g," ").trim(); d.content=body.slice(0,200); }
  d.auto=n; return d;
}

const DRIVE_ROOT_NAME="Фирмалар базаси — ҳужжатлар";
const DIR_CACHE={};
const dirClean=s=>String(s||"").replace(/[\\/:*?"<>|«»]+/g,"").replace(/\s+/g," ").trim().slice(0,90)||"—";
const secName=k=>({reqs:"Реквизитлар",import:"Импорт ҳужжатлари",other:"Бошқа ҳужжатлар"})[k]||FIRM_MENUS.find(m=>m.k===k)?.t||k;
const qEsc=s=>String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'");
async function driveSub(parent,name,props){
  const key=parent+"/"+name; if(DIR_CACHE[key]) return DIR_CACHE[key];
  let q=`mimeType='application/vnd.google-apps.folder' and trashed=false and '${parent}' in parents`;
  q+=props?Object.entries(props).map(([k,v])=>` and appProperties has { key='${k}' and value='${qEsc(v)}' }`).join(""):` and name='${qEsc(name)}'`;
  const r=await api("GET",`${DRIVE}?q=${encodeURIComponent(q)}&fields=files(id,name)&spaces=drive&pageSize=5`);
  let f=r.files?.[0];
  if(f&&props&&f.name!==name){ try{ await api("PATCH",`${DRIVE}/${f.id}?fields=id`,{name}); }catch(e){} }
  if(!f) f=await api("POST",`${DRIVE}?fields=id`,{name,mimeType:"application/vnd.google-apps.folder",parents:[parent],appProperties:{fbp:DB_ID,...(props||{})}});
  return DIR_CACHE[key]=f.id;
}
function firmDirName(f){ return dirClean(f?.name||"Фирма")+(f?.inn?` (СТИР ${String(f.inn).trim()})`:""); }
function inferLoc(){ const sub=V.tab==="import"?(V.impSub==="fc"?["Ташқи савдо контрактлари"]:["ГТД"]):[]; return {firmId:V.firmId,sec:V.tab&&V.tab!=="overview"?V.tab:"other",sub}; }
async function drivePath(loc){
  loc=loc||inferLoc(); const root=await driveFolderId(); const f=firm(loc.firmId); if(!f) return root;
  let id=await driveSub(root,firmDirName(f),{fbfirm:f.id});
  id=await driveSub(id,secName(loc.sec||"other"),{fbsec:loc.sec||"other",fbof:f.id});
  for(const s of (loc.sub||[]).filter(Boolean)) id=await driveSub(id,dirClean(s));
  return id;
}
const ymOf=d=>String(d||localToday()).slice(0,7);
const yOf=d=>String(d||localToday()).slice(0,4);
function attLoc(kind,o){ o=o||{}; const fid=o.firmId;
  if(kind==="orders") return {firmId:fid,sec:"orders",sub:[yOf(o.values?.date)]};
  if(kind==="gtd") return {firmId:fid,sec:"import",sub:["ГТД",ymOf(o.date)]};
  if(kind==="emp") return {firmId:fid,sec:"staff",sub:[o.type==="emp"?(o.fio||"ходим"):"Умумий"]};
  if(kind==="firms") return {firmId:o.id,sec:"reqs",sub:[]};
  const t=o.type;
  if(t==="loan") return {firmId:fid,sec:"loans",sub:["№ "+(o.number||"")+" "+(o.person||"")]};
  if(t==="check") return {firmId:fid,sec:"check",sub:[o.name||""]};
  if(t==="contract") return {firmId:fid,sec:"contracts",sub:[(o.dir||"in")==="out"?"Чиқувчи":"Кирувчи"]};
  if(t==="charter") return {firmId:fid,sec:"charter",sub:[o.kind||"Устав"]};
  if(t==="fcontract") return {firmId:fid,sec:"import",sub:["Ташқи савдо контрактлари","Контракт "+(o.number||"")]};
  if(t==="ccheck") return {firmId:fid,sec:"cards",sub:[o.card?.last4?`${o.card.type||"Карта"} ${o.card.first4||""}-${o.card.last4}`:"Карта кўрсатилмаган",ymOf(o.date)]};
  if(t==="letter") return {firmId:fid,sec:"office",sub:[o.dir==="out"?"Чиқувчи хатлар":"Кирувчи хатлар",yOf(o.regDate)]};
  if(t==="taxrep") return {firmId:fid,sec:"taxrep",sub:[trName(o.kind),yOf(o.period)]};

}
function driveAllFiles(withDemo){
  const out=[]; const add=(fl,loc)=>{ if(fl&&fl.id&&(withDemo||!fl.demo)) out.push({id:fl.id,loc}); };
  S.firms.forEach(f=>{ Object.values(f.docs||{}).forEach(d=>add(d?.file,{firmId:f.id,sec:"reqs",sub:["Гувоҳномалар"]})); (f.licenses||[]).forEach(l=>add(l.file,{firmId:f.id,sec:"reqs",sub:["Лицензиялар"]})); });
  S.orders.forEach(o=>(o.files||[]).forEach(x=>add(x.file,attLoc("orders",o))));
  S.gtd.forEach(r=>{ add(r.file,attLoc("gtd",r)); (r.files||[]).forEach(x=>add(x.file,attLoc("gtd",r))); });
  [...S.emp,...S.pos,...S.vplan].forEach(e=>(e.files||[]).forEach(x=>add(x.file,attLoc("emp",e))));
  S.recs.forEach(r=>{ const L=attLoc("recs",r); add(r.file,L); (r.files||[]).forEach(x=>add(x.file,L));
    if(r.type==="fcontract"){ (r.specs||[]).forEach(x=>add(x.file,{...L,sub:[...L.sub,"Спецификациялар"]})); (r.acts||[]).forEach(x=>add(x.file,{...L,sub:[...L.sub,"Актлар"]})); (r.addenda||[]).forEach(x=>add(x.file,{...L,sub:[...L.sub,"Қўшимча келишувлар"]})); }
    if(r.type==="finrep") Object.values(r.forms||{}).forEach(x=>add(x?.file,L)); });

}
const DRV_ORG_LK=()=>"fb-drive-org-"+DB_ID+"-"+(ME.email||"");
async function driveReorganize(onP){
  const list=driveAllFiles(); let moved=0, same=0, fail=0;
  for(let i=0;i<list.length;i++){ const it=list[i]; onP&&onP(`${i+1}/${list.length}`);
    try{ const target=await drivePath(it.loc); const meta=await api("GET",`${DRIVE}/${it.id}?fields=id,parents`); const ps=meta.parents||[];
      if(ps.length===1&&ps[0]===target){ same++; continue; }
      await api("PATCH",`${DRIVE}/${it.id}?addParents=${target}${ps.length?"&removeParents="+ps.join(","):""}&fields=id`,{}); moved++; }
    catch(e){ if(e instanceof AuthErr) throw e; fail++; } }
  ls.set(DRV_ORG_LK(),String(Date.now()));
  return {moved,same,fail,total:list.length};
}

async function ccImpSave(){ const f=firm(V.firmId); const I=V.ccImport; if(!f||!I||I.saving) return; I.saving=true; ccImpRefresh(); let ok=0, bad=0, firstM="";

function requisitesText(f,lang){
  const L=lang==="ru"?{addr:"Юридический адрес",inn:"ИНН",oked:"ОКЭД",vat:"Рег. код плательщика НДС",acc:"Р/с",bank:"Банк",mfo:"МФО",swift:"SWIFT",tel:"Тел.",mail:"E-mail",dir:"Директор"}

function fillBody(tpl, values, f, clean){

    if(key.startsWith("firm.")){ const v=f?.[key.slice(5)]; return v?wrap(v,"fa"):wrap("["+key.slice(5)+" киритилмаган]","miss"); }

  return tpl.body.replace(/\{\{([\w.]+)\}\}/g,(_,k)=>get(k));

  if(t.dataset.set){
    const o=V.draft; const st=t.dataset.set;

    else if(st===saved.status) note = changed?"Реквизитлар таҳрирланди":"Қайта сақланди";
    else note = (changed?"Таҳрирланди, ":"") + (st==="draft"?"черновикка қайтарилди":st==="signing"?"имзолаш жараёнига ўтказилди":"имзоланган деб белгиланди");

    try{ V.draft = await putItem("orders", o, note); toast(st==="draft"?"Черновикка сақланди":st==="signing"?"Ҳолат: имзолаш жараёнида":"Буйруқ имзоланган деб белгиланди"); }
    catch(err){ t.disabled=false; if(saved) o.status=saved.status; toast(explain(err)); if(err instanceof ConflictErr) go({view:"firm",tab:"orders"}); return; }
    const hrT=TEMPLATES.find(x=>x.id===o.tplId)?.hr;
    if(hrT&&st==="signed"&&o.values?.emp){ await ensureEmp(); await hrApply(V.draft); }
    if(hrT==="vplan"&&st==="signed"){ await ensureEmp(); await vpApprove(V.draft); }
    if(st==="draft"){ render(); } else if(hrT==="vplan") go({view:"firm",tab:"staff",hrSub:"plan",vpYear:o.values?.year||V.vpYear,empId:null}); else if(hrT&&o.values?.emp) go({view:"firm",tab:"staff",empId:o.values.emp}); else go({view:"firm",tab:"orders"});
    return;
  }
  const a=t.dataset.act||(t.id==="addFirmBtn"?"addFirm":"");
  if(a&&a.startsWith("vp")){ const f=firm(V.firmId); if(!f) return; const y=String(V.vpYear||new Date().getFullYear()); const P=vplanOf(f.id,y); const d=V.vpEdit;
    const empsA=()=>firmEmps(f.id).filter(e=>e.status!=="fired");

    if(a==="vpAutoFill"&&d){ vpAuto(d.rows,d.year,firmEmps(f.id)); return render(); }
    if(a==="vpSave"&&d){ const bad=d.rows.find(r=>r.from&&r.to&&r.to<r.from); if(bad){ $("#vpErr").textContent="Тугаш санаси бошланишидан олдин бўлиши мумкин эмас."; return; }
      d.rows=d.rows.filter(r=>r.empId); const isNew=!S.vplan.some(p=>p.id===d.id); t.disabled=true;

      catch(er){ t.disabled=false; $("#vpErr").textContent=explain(er); return; } return render(); }
    if(a==="vpPrint"&&P){ $("#printArea").innerHTML=vpSheet(f,P); window.print(); return; }
    if(a==="vpXlsx"&&P){ try{ await vpXlsx(f,P); }catch(er){ toast("Excel тузиб бўлмади: "+(er?.message||er)); } return; }
    if(a==="vpApproveOrder"&&P){ const dr=hrOrderDraft("k-vplan",null); dr.values.year=y; dr.values.vplan=P.id; dr.values.resp=f.chiefAccountant||""; return go({view:"order",draft:dr}); }

  }

  if(a==="ccImpSave") return ccImpSave();
  if(a==="ccImpDel"){ const I=V.ccImport; if(!I||I.saving) return; I.items.splice(+t.dataset.i,1); if(!I.items.length) return go({ccImport:null}); const f=firm(V.firmId); I.items.forEach(x=>{ if(x.d&&["ok","dup"].includes(x.status)) ccItemStatus(f,x); }); return ccImpRefresh(); }

  if(a==="letDel"){ const l=S.recs.find(x=>x.id===V.letId); if(!l||!confirmTwice(t,"Хатни ўчириш учун яна бир марта босинг")) return; try{ await delItem("recs",l.id,`${LET_DIR[l.dir].t} хат № ${l.regNo||""} ўчирилди`); toast("Ўчирилди"); }catch(er){ toast(explain(er)); } return go({letId:null}); }

  if(a==="letPrint"){ const f=firm(V.firmId); const dir=V.letDir||"in"; $("#printArea").innerHTML=letSheet(f,dir,sortD(firmLetters(f.id).filter(l=>l.dir===dir),l=>(l.regDate||"")+p6(l.regNo),"asc")); window.print(); return; }
  if(a&&a.startsWith("col")&&V.colCfg){ const key=V.colCfg, k=t.dataset.k, on=(COL_MEM[key]||colKeys(key)).slice(); const i=on.indexOf(k);
    if(a==="colClose"){ V.colCfg=null; return render(); }
    if(a==="colUp"&&i>0) colMove(key,k,i-1);
    if(a==="colDown"&&i>=0) colMove(key,k,i+1);

    if(a==="colOn"&&i<0){ on.push(k); colSet(key,on); }

async function afterLogin(){
  const u = await api("GET","https://www.googleapis.com/oauth2/v3/userinfo");
  ME.email = u.email; ME.name = u.name || u.email; NAMES[ME.email]=ME.name;
  if(!DB_ID){ showGate("setup"); return; }
  try{ await refresh(); }
  catch(e){ if(e instanceof AuthErr) throw e; DB_ID=null; ls.del(LSK.db); showGate("setup","Аввалги базани очиб бўлмади: "+e.message); return; }
  showApp();
}

let pickerReady=null;
function loadPicker(){
  if(!pickerReady) pickerReady = loadScript("https://apis.google.com/js/api.js").then(()=>new Promise(r=>gapi.load("picker",r)));
  return pickerReady;
}
async function pickBase(){
  await loadPicker();
  return new Promise(res=>{
    const view = new google.picker.DocsView(google.picker.ViewId.SPREADSHEETS).setMode(google.picker.DocsViewMode.LIST).setIncludeFolders(false);
    const shared = new google.picker.DocsView(google.picker.ViewId.SPREADSHEETS).setMode(google.picker.DocsViewMode.LIST).setOwnedByMe(false);
    new google.picker.PickerBuilder()
      .addView(shared).addView(view)
      .setOAuthToken(TOKEN).setDeveloperKey(CONFIG.API_KEY).setAppId(CONFIG.APP_ID)
      .setTitle("«Фирмалар базаси (дастур)» жадвалини танланг").setLocale("ru")
      .setCallback(d=>{ if(d.action===google.picker.Action.PICKED) res(d.docs[0].id); else if(d.action===google.picker.Action.CANCEL) res(null); })
      .build().setVisible(true);
  });
}

document.addEventListener("click", async e=>{
  const t = e.target.closest("[data-g]"); if(!t) return;
  const a = t.dataset.g;
  try{
    if(a==="login"){ await requestToken("select_account"); showGate("loading"); await afterLogin(); }
    if(a==="reauth"){ await requestToken(""); toast("Давом этишингиз мумкин"); poll(); }
    if(a==="reload"){ location.reload(); }
    if(a==="create"){
      t.disabled=true; showGate("loading");
      DB_ID = await GS.create(); ls.set(LSK.db, DB_ID); await refresh(); showGate("created");
    }
    if(a==="enter"){ showApp(); }
    if(a==="pick"){
      const id = await pickBase(); if(!id) return;
      showGate("loading");
      let ok=false; try{ ok = await GS.check(id); }catch(err){ showGate("setup","Бу жадвални очиб бўлмади: "+err.message); return; }
      if(!ok){ showGate("setup","Танланган жадвал фирмалар базаси эмас. «Фирмалар базаси (дастур)» жадвалини танланг."); return; }
      DB_ID=id; ls.set(LSK.db,id); await refresh(); showApp();
    }
    if(a==="switch"){ DB_ID=null; ls.del(LSK.db); showGate("setup"); }
    if(a==="logout"){
      try{ if(TOKEN) google.accounts.oauth2.revoke(TOKEN,()=>{}); }catch(err){}
      TOKEN=null; ss.del(LSK.tok); ME.email=""; showGate("login");
    }
  }catch(err){
    if(a==="login"||a==="create"||a==="pick") showGate(a==="login"?"login":"setup", err.message);
    else toast(err.message);
  }
});

/* ---------- boot ---------- */
(async()=>{
  if(DEMO){
    ME.email="demo@example.com"; ME.name="Демо фойдаланувчи";
    await refresh(); showApp();
    $("#demoBar").hidden=false;
    return;
  }
  DB_ID = ls.get(LSK.db);
  showGate("loading");
  try{ await loadScript("https://accounts.google.com/gsi/client"); }
  catch(e){ showGate("error","Google хизматлари юкланмади. Интернетни текширинг."); return; }
  loadPicker().catch(()=>{});
  try{ const t=JSON.parse(ss.get(LSK.tok)||"null"); if(t && t.e>Date.now()){ TOKEN=t.t; TOKEN_EXP=t.e; scheduleExpiry(); } }catch(e){}
  if(TOKEN){ try{ await afterLogin(); return; }catch(e){} }
  showGate("login");
})();
</script>
