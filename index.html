  if(e.target.closest("#firmForm")) onFirmInput(e.target,false);
  if(e.target.closest("#loanForm")) onLoanInput(e.target);
  if(e.target.closest("#ckForm")) onCkInput(e.target);
  if(e.target.closest(".ctform")) onCtInput(e.target,false);
  if(e.target.id==="g_q"){ V.gQ=e.target.value; V.gLimit=200; const fid=V.view==="firm"?V.firmId:null; const b=$("#gTable"); if(b) b.innerHTML=gtdTableHTML(fid); const st=$("#gStats"); if(st){ const l=gtdFiltered(fid); st.innerHTML=l.length?gtdStats(l):""; } }
  if(e.target.id==="cp_q"){ V.cpQ=e.target.value; const box=$("#cpTable"); if(box) box.innerHTML=cpTableHTML(cpIndex()); }
  if(e.target.id==="ct_q"){ V.ctQ=e.target.value; const f=firm(V.firmId); const box=$("#ctTable"); if(f&&box) box.innerHTML=ctTableHTML(f); }
});
function onCtInput(el,isChange){
  if(!el.name||!el.name.includes("|")) return; const [pfx,k]=el.name.split("|");
  const d=pfx==="ct"?V.ctEdit:V.ctImport?.items[+pfx.slice(2)]?.d; if(!d) return;
  setPath(d,k,el.value); el.closest(".field")?.classList.remove("pdfauto");
  if(pfx==="ct"&&d.gen){
    if(k==="gen.tpl"){ d.subj=CTG[el.value].subj; d.gen.amtMode=el.value==="sale"?"total":"monthly"; if(el.value==="sale"&&!d.gen.prepay) d.gen.prepay="30"; }
    if(["gen.tpl","gen.lang","dir"].includes(k)){ render(); return; }
    const pv=$("#ctgPrev"); const f=firm(V.firmId); if(pv&&f) pv.innerHTML=ctgSheet(f,d,false);
  }
  const au=pfx==="ct"?V.ctEditAuto:V.ctImport?.items[+pfx.slice(2)]?.auto; au?.delete?.(k);
  if(isChange&&(k==="cp.name"||k==="cp.inn")&&el.value.trim()){ const cp=ctKnownCp(V.firmId,k==="cp.inn"?"inn":"name",el.value); if(cp){ let n=0; d.cp=d.cp||{}; Object.entries(cp).forEach(([kk,vv])=>{ if(vv&&!d.cp[kk]){ d.cp[kk]=vv; n++; } }); if(n){ toast("Контрагентнинг "+n+" та реквизити аввалги шартномадан олинди"); render(); } } }
}
function onCkInput(el){
  const d=V.ckEdit; if(!d||d==="tpl"||!el.name||el.name==="itemsText") return;
  d[el.name]=el.type==="checkbox"?el.checked:el.value;
  if(el.name==="period"){ const box=$("#ckDue"); if(box) box.innerHTML=ckDueFields(d); }
}
function onLoanInput(el){
  if(!V.loanEdit||!el.name) return;
  if(el.name.startsWith("acc.")){ V.loanEdit.acc=V.loanEdit.acc||{}; V.loanEdit.acc[el.name.slice(4)]=el.value.replace(/[^\d]/g,""); el.value=V.loanEdit.acc[el.name.slice(4)]; const h=el.nextElementSibling; if(h) h.textContent=ACC_NAMES[el.value||el.placeholder]||""; return; }
  V.loanEdit[el.name]=el.value;
  if(el.name==="dir"){ const t=$("#lf_taxRate"); if(t) t.disabled=el.value==="out"; }
  if(el.name==="dir"||el.name==="date"||el.name==="endDate"){ const box=$("#loanAccs"); if(box) box.innerHTML=loanAccFields(V.loanEdit); }
  if(el.name==="kind"){ const r=$("#lf_rate"); if(r){ r.disabled=el.value==="процентсиз"; if(r.disabled){ r.value=""; V.loanEdit.rate=""; } } }
  if(["amount","rate","taxRate"].includes(el.name)) el.value=el.value.replace(/[^\d.,\s]/g,"");
  const pv=$("#loanPrev"); if(pv) pv.innerHTML=loanPreview(V.loanEdit);
}
document.addEventListener("change",e=>{
  if(e.target.closest("#firmForm")) onFirmInput(e.target,true);
  if(e.target.closest("#loanForm")) onLoanInput(e.target);
  if(e.target.closest("#ckForm")) onCkInput(e.target);
  if(e.target.closest(".ctform")&&e.target.type!=="file") onCtInput(e.target,true);
  if(e.target.id==="g_month"){ V.gMonth=e.target.value; V.gLimit=200; render(); }
  if(e.target.id==="g_firm"){ V.gFirm=e.target.value; V.gLimit=200; render(); }
  if(e.target.dataset?.gimpfirm!=null&&V.gImport){ const it=V.gImport.items[+e.target.dataset.gimpfirm]; if(it){ it.firmId=e.target.value; if(it.status==="nofirm"||it.status==="ok") it.status=it.firmId?"ok":"nofirm"; gtdImpRefresh(); } }
  if(e.target.id==="rep_month"&&e.target.value){ V.loanRep=e.target.value; render(); }
  if(e.target.id==="rep_no"){ V.repNo=e.target.value.trim(); render(); }
  if(e.target.closest("#orderForm")){ V.draft.values[e.target.name]=e.target.value; $("#sheetWrap").innerHTML=sheetHTML(V.draft); }
});
document.addEventListener("change",async e=>{
  const el=e.target; if(el.type!=="file") return;
  if(el.id==="gtdFiles"){ const fs=[...el.files]; el.value=""; if(fs.length) await gtdReadFiles(fs,V.view==="firm"?V.firmId:""); return; }
  if(el.id==="ctFiles"){ const fs=[...el.files]; el.value=""; if(fs.length) await ctReadFiles(fs); return; }
  if(el.id==="ctOneFile"){ const fl=el.files[0]; el.value=""; if(!fl||!V.ctEdit) return; V.ctEditFile=fl; render();
    try{ const r=await pdfToText(fl); if(r.text.replace(/\s/g,"").length<40){ toast("Сканер қилинган PDF — матн танилмоқда (OCR)…"); try{ r.text=(await pdfOcr(fl,m=>{ const t=$("#toast"); if(t){ t.textContent="OCR: "+m; t.hidden=false; } })).text; }catch(e){} }
      if(r.text.replace(/\s/g,"").length>=40){ const p=ctParse(r.text,firm(V.firmId)); V.ctEditAuto=ctApplyParsed(V.ctEdit,p,true); toast(V.ctEditAuto.size?V.ctEditAuto.size+" та бўш майдон PDF'дан тўлдирилди":"PDF'дан янги маълумот топилмади"); } else toast("PDF'дан матн ўқиб бўлмади — маълумотни қўлда киритинг"); }
    catch(err){ toast("PDF'ни ўқиб бўлмади"); } if(V.ctEdit) render(); return; }
  if(el.id==="ctAttach"){ const fl=el.files[0]; el.value=""; const C=S.recs.find(x=>x.id===V.ctId); if(!fl||!C) return; toast("PDF юкланмоқда…");
    try{ const o=JSON.parse(JSON.stringify(C)); o.file=await driveUpload(fl,ctFileName(firm(o.firmId),o)); await putItem("recs",o,C.file?"PDF алмаштирилди":"PDF бириктирилди"); toast("PDF сақланди"); }catch(err){ toast(explain(err)); } render(); return; }
});
document.addEventListener("submit",async e=>{
  if(e.target.id==="firmForm"){
    e.preventDefault();
    Object.keys(V.draft).forEach(k=>{ if(typeof V.draft[k]==="string") V.draft[k]=V.draft[k].trim(); });
    if(!V.draft.name){ $("#firmErr").textContent="Фирма номини киритинг."; $("#ff_name").focus(); return; }
    const isNewF=!S.firms.some(x=>x.id===V.draft.id);
    try{ V.draft = await putItem("firms", V.draft, isNewF?"Фирма қўшилди":"Реквизитлар ўзгартирилди"); }catch(err){ $("#firmErr").textContent=explain(err); if(err instanceof ConflictErr) setTimeout(()=>go({view:"firm",tab:"reqs"}),2500); return; }
    toast("Фирма реквизитлари сақланди");
    go({view:"firm",firmId:V.draft.id,tab:"reqs"});
  }
  if(e.target.id==="orderForm") e.preventDefault();
  if(e.target.id==="loanForm"){
    e.preventDefault(); const d=V.loanEdit; if(!d) return; const err=$("#loanErr");
    Object.keys(d).forEach(k=>{ if(typeof d[k]==="string") d[k]=d[k].trim(); });
    ["amount","rate","taxRate"].forEach(k=>{ if(d[k]) d[k]=String(num(d[k])); });
    if(!d.person){ err.textContent="Шахснинг Ф.И.О. ёки номини киритинг."; $("#lf_person").focus(); return; }
    if(!d.date||!d.endDate){ err.textContent="Шартнома санаси ва қайтариш санасини киритинг."; return; }
    if(d.endDate<d.date){ err.textContent="Қайтариш санаси шартнома санасидан олдин бўлиши мумкин эмас."; $("#lf_endDate").focus(); return; }
    if(!(num(d.amount)>0)){ err.textContent="Шартнома суммасини киритинг."; $("#lf_amount").focus(); return; }
    if(d.kind==="процентли"&&!(num(d.rate)>0)){ err.textContent="Фоизли шартнома учун йиллик фоиз ставкасини киритинг."; $("#lf_rate").focus(); return; }
    if(d.kind==="процентсиз") d.rate="";
    if(d.acc){ Object.keys(d.acc).forEach(k=>{ if(!d.acc[k]) delete d.acc[k]; }); if(!Object.keys(d.acc).length) delete d.acc; }
    const isNew=!S.recs.some(x=>x.id===d.id);
    const btn=e.target.querySelector("[type=submit]"); btn.disabled=true;
    try{ const o=await putItem("recs", d, isNew?`Займ шартномаси № ${d.number||""} қўшилди (${d.person}, ${m0(num(d.amount))} сўм)`:`Займ шартномаси № ${d.number||""} таҳрирланди`); toast("Шартнома сақланди"); go({loanEdit:null, loanId:o.id}); }
    catch(er){ btn.disabled=false; err.textContent=explain(er); if(er instanceof ConflictErr) setTimeout(()=>go({loanEdit:null}),2500); }
  }
  if(e.target.id==="ctForm"){
    e.preventDefault(); const d=V.ctEdit; if(!d) return; const err=$("#ctErr"); ctClean(d); const m=ctValidate(d); if(m){ err.textContent=m; return; }
    const isNew=!S.recs.some(x=>x.id===d.id); const btn=e.target.querySelector("[type=submit]"); btn.disabled=true;
    try{ if(V.ctEditFile){ err.textContent="PDF юкланмоқда…"; d.file=await driveUpload(V.ctEditFile,ctFileName(firm(d.firmId),d)); }
      const o=await putItem("recs",d,isNew?`Шартнома № ${d.number||"—"} (${d.cp.name}) қўшилди`:`Шартнома № ${d.number||"—"} таҳрирланди${V.ctEditFile?" (PDF алмаштирилди)":""}`);
      toast("Шартнома сақланди"); go({ctEdit:null,ctEditFile:null,ctEditAuto:null,ctId:o.id}); }
    catch(er){ btn.disabled=false; err.textContent=explain(er); if(er instanceof ConflictErr) setTimeout(()=>go({ctEdit:null}),2500); }
  }
  if(e.target.id==="ckForm"){
    e.preventDefault(); const d=V.ckEdit; if(!d||d==="tpl") return; const err=$("#ckErr");
    ["name","owner","note"].forEach(k=>{ if(typeof d[k]==="string") d[k]=d[k].trim(); });
    const lines=$("#ck_items").value.split("\n").map(x=>x.trim().replace(/^[-•*–]\s+/,"")).filter(Boolean);
    if(!d.name){ err.textContent="Чек лист номини киритинг."; $("#ck_name").focus(); return; }
    if(!lines.length){ err.textContent="Камида битта банд ёзинг."; $("#ck_items").focus(); return; }
    if(d.period==="once"&&d.dueDate&&d.startDate&&d.dueDate<d.startDate){ err.textContent="Муддат бошланиш санасидан олдин бўлиши мумкин эмас."; return; }
    const pool=(d.items||[]).slice(); d.items=lines.map(text=>{ const i=pool.findIndex(x=>x.text===text); if(i>=0) return pool.splice(i,1)[0]; return {id:uid(),text}; });
    const isNew=!S.recs.some(x=>x.id===d.id);
    const btn=e.target.querySelector("[type=submit]"); btn.disabled=true;
    try{ const o=await putItem("recs",d,isNew?`Чек лист «${d.name}» яратилди (${CK_PER[d.period].s}, ${d.items.length} та банд)`:`Чек лист «${d.name}» таҳрирланди`); toast("Чек лист сақланди"); go({ckEdit:null,ckId:o.id,ckKey:null}); }
    catch(er){ btn.disabled=false; err.textContent=explain(er); if(er instanceof ConflictErr) setTimeout(()=>go({ckEdit:null}),2500); }
  }
  if(e.target.id==="repForm"){
    e.preventDefault(); const L=S.recs.find(x=>x.id===V.loanId); if(!L) return; const err=$("#repErr");
    const date=$("#rp_date").value, sum=num($("#rp_sum").value), note=$("#rp_note").value.trim();
    if(!date){ err.textContent="Қайтариш санасини киритинг."; return; }
    if(!(sum>0)){ err.textContent="Қайтариш суммасини киритинг."; $("#rp_sum").focus(); return; }
    if(date<L.date){ err.textContent="Қайтариш санаси шартнома санасидан олдин бўлиши мумкин эмас."; return; }
    const c=loanCalc(L); if(sum>c.bal+0.004){ err.textContent=`Сумма қолдиқдан катта: қолдиқ ${m0(c.bal)} сўм.`; return; }
    const o=JSON.parse(JSON.stringify(L)); o.repays=o.repays||[]; o.repays.push({id:uid(),date,sum:String(sum),note,by:ME.email,at:Date.now()});
    const btn=e.target.querySelector("[type=submit]"); btn.disabled=true;
    try{ await putItem("recs", o, `Қайтариш киритилди: ${fmtDate(date)} — ${m0(sum)} сўм`); toast("Қайтариш қўшилди, фоиз қайта ҳисобланди"); render(); }
    catch(er){ btn.disabled=false; err.textContent=explain(er); }
  }
});

/* ---------- entry screens: sign in, choose or create the base ---------- */
const sheetUrl = () => `https://docs.google.com/spreadsheets/d/${DB_ID}/edit`;
function showGate(state, msg){
  $(".app").hidden = true; const g=$("#gate"); g.hidden = false;
  const err = msg ? `<div class="gerr">${esc(msg)}</div>` : "";
  const brand = `<div class="gbrand">Фирмалар<small>Реквизитлар ва буйруқлар</small></div>`;
  let body = "";
  if(state==="loading") body = `<p class="hint">Юкланмоқда…</p>`;
  if(state==="login") body = `
    <h1>Дастурга кириш</h1>
    <p>Иш Gmail ҳисобингиз билан киринг. Фақат раҳбар рухсат берган ҳисоблар кира олади.</p>
    ${err}
    <button type="button" class="btn primary big" data-g="login">${GICON}Google орқали кириш</button>`;
  if(state==="setup") body = `
    <h1>Базани танланг</h1>
    <p>Сиз: <b>${esc(ME.name)}</b> <span class="hint">${esc(ME.email)}</span></p>
    ${err}
    <div class="gopts">
      <button type="button" class="gopt" data-g="pick"><b>Мавжуд базага уланиш</b><span>Ёрдамчилар учун. Раҳбар сизга «Фирмалар базаси (дастур)» жадвалини улашган бўлиши керак. Уни рўйхатдан танлайсиз.</span></button>
      <button type="button" class="gopt" data-g="create"><b>Янги база яратиш</b><span>Фақат раҳбар учун, бир марта. Google Drive'ингизда янги жадвал очилади.</span></button>
    </div>
    <button type="button" class="back" data-g="logout">← Бошқа ҳисоб билан кириш</button>`;
  if(state==="created") body = `
    <h1>База яратилди</h1>
    <p>Google Drive'ингизда <b>«Фирмалар базаси (дастур)»</b> жадвали пайдо бўлди. Ёрдамчиларингиз кириши учун уни улашинг:</p>
    <ol class="steps">
      <li><a href="${esc(sheetUrl())}" target="_blank" rel="noopener">Жадвални очинг</a></li>
      <li>Ўнг юқоридаги <b>Share</b> (Настройки доступа) тугмасини босинг</li>
      <li>Ёрдамчиларнинг Gmail манзилини киритинг, ҳуқуқ: <b>Editor</b> (Редактор)</li>
      <li>«General access» бўлимида <b>Restricted</b> (Доступ ограничен) турганини текширинг</li>
    </ol>
    <p class="hint">Жадвални қўлда таҳрирламанг: дастур уни ўзи юритади.</p>
    <button type="button" class="btn primary big" data-g="enter">Дастурга ўтиш</button>`;
  if(state==="error") body = `<h1>Хатолик</h1>${err}<button type="button" class="btn" data-g="reload">Қайта уриниш</button>`;
  g.innerHTML = `<div class="gatecard card">${brand}${body}</div>`;
}
const GICON = '<svg viewBox="0 0 18 18" width="18" height="18"><path fill="#4285F4" d="M17.6 9.2c0-.6-.1-1.2-.2-1.7H9v3.3h4.8a4.1 4.1 0 0 1-1.8 2.7v2.2h2.9c1.7-1.6 2.7-3.9 2.7-6.5z"/><path fill="#34A853" d="M9 18c2.4 0 4.5-.8 6-2.2l-2.9-2.2c-.8.5-1.8.9-3.1.9-2.4 0-4.4-1.6-5.1-3.8H.9v2.3A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.9 10.7a5.4 5.4 0 0 1 0-3.4V5H.9a9 9 0 0 0 0 8z"/><path fill="#EA4335" d="M9 3.6c1.3 0 2.5.5 3.5 1.4l2.6-2.6A9 9 0 0 0 .9 5l3 2.3C4.6 5.2 6.6 3.6 9 3.6z"/></svg>';

function showApp(){
  $("#gate").hidden = true; $(".app").hidden = false;
  const l=$("#meLine");
  l.innerHTML = `<span>Сиз: <b>${esc(ME.name)}</b></span>` +
    (DEMO ? "" : `<a href="${esc(sheetUrl())}" target="_blank" rel="noopener">Базани Google Sheets'да очиш</a><button type="button" class="linkbtn" data-g="switch">Базани алмаштириш</button><button type="button" class="linkbtn" data-g="logout">Чиқиш</button>`) +
    `<span class="hint" id="syncLine"></span>`;
  l.hidden = false; setSync(); render();
}

async function afterLogin(){
  const u = await api("GET","https://www.googleapis.com/oauth2/v3/userinfo");
  ME.email = u.email; ME.name = u.name || u.email; NAMES[ME.email]=ME.name;
  if(!DB_ID){ showGate("setup"); return; }
  try{ await refresh(); }
  catch(e){ if(e instanceof AuthErr) throw e; DB_ID=null; ls.del(LSK.db); showGate("setup","Аввалги базани очиб бўлмади: "+e.message); return; }
  showApp();
}

let pickerReady=null;
function loadPicker(){
  if(!pickerReady) pickerReady = loadScript("https://apis.google.com/js/api.js").then(()=>new Promise(r=>gapi.load("picker",r)));
  return pickerReady;
}
async function pickBase(){
  await loadPicker();
  return new Promise(res=>{
    const view = new google.picker.DocsView(google.picker.ViewId.SPREADSHEETS).setMode(google.picker.DocsViewMode.LIST).setIncludeFolders(false);
    const shared = new google.picker.DocsView(google.picker.ViewId.SPREADSHEETS).setMode(google.picker.DocsViewMode.LIST).setOwnedByMe(false);
    new google.picker.PickerBuilder()
      .addView(shared).addView(view)
      .setOAuthToken(TOKEN).setDeveloperKey(CONFIG.API_KEY).setAppId(CONFIG.APP_ID)
      .setTitle("«Фирмалар базаси (дастур)» жадвалини танланг").setLocale("ru")
      .setCallback(d=>{ if(d.action===google.picker.Action.PICKED) res(d.docs[0].id); else if(d.action===google.picker.Action.CANCEL) res(null); })
      .build().setVisible(true);
  });
}

document.addEventListener("click", async e=>{
  const t = e.target.closest("[data-g]"); if(!t) return;
  const a = t.dataset.g;
  try{
    if(a==="login"){ await requestToken("select_account"); showGate("loading"); await afterLogin(); }
    if(a==="reauth"){ await requestToken(""); toast("Давом этишингиз мумкин"); poll(); }
    if(a==="reload"){ location.reload(); }
    if(a==="create"){
      t.disabled=true; showGate("loading");
      DB_ID = await GS.create(); ls.set(LSK.db, DB_ID); await refresh(); showGate("created");
    }
    if(a==="enter"){ showApp(); }
    if(a==="pick"){
      const id = await pickBase(); if(!id) return;
      showGate("loading");
      let ok=false; try{ ok = await GS.check(id); }catch(err){ showGate("setup","Бу жадвални очиб бўлмади: "+err.message); return; }
      if(!ok){ showGate("setup","Танланган жадвал фирмалар базаси эмас. «Фирмалар базаси (дастур)» жадвалини танланг."); return; }
      DB_ID=id; ls.set(LSK.db,id); await refresh(); showApp();
    }
    if(a==="switch"){ DB_ID=null; ls.del(LSK.db); showGate("setup"); }
    if(a==="logout"){
      try{ if(TOKEN) google.accounts.oauth2.revoke(TOKEN,()=>{}); }catch(err){}
      TOKEN=null; ss.del(LSK.tok); ME.email=""; showGate("login");
    }
  }catch(err){
    if(a==="login"||a==="create"||a==="pick") showGate(a==="login"?"login":"setup", err.message);
    else toast(err.message);
  }
});

/* ---------- boot ---------- */
(async()=>{
  if(DEMO){
    ME.email="demo@example.com"; ME.name="Демо фойдаланувчи";
    await refresh(); showApp();
    $("#demoBar").hidden=false;
    return;
  }
  DB_ID = ls.get(LSK.db);
  showGate("loading");
  try{ await loadScript("https://accounts.google.com/gsi/client"); }
  catch(e){ showGate("error","Google хизматлари юкланмади. Интернетни текширинг."); return; }
  loadPicker().catch(()=>{});
  try{ const t=JSON.parse(ss.get(LSK.tok)||"null"); if(t && t.e>Date.now()){ TOKEN=t.t; TOKEN_EXP=t.e; scheduleExpiry(); } }catch(e){}
  if(TOKEN){ try{ await afterLogin(); return; }catch(e){} }
  showGate("login");
})();
</script>
