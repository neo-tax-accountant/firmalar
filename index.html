<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f6e5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Фирмалар ва буйруқлар</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f6e5c'/%3E%3Cpath d='M20 16h18l8 8v24H20z' fill='%23fff'/%3E%3Cpath d='M26 32h14M26 38h14M26 44h8' stroke='%230f6e5c' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* Layout: firm rail on the left (top on phones), working area on the right; order editor = form beside a paper sheet */
:root{
  --bg:#eef1f0; --panel:#ffffff; --ink:#15211f; --muted:#5b6b67; --line:#d5dcda;
  --accent:#0f6e5c; --accent-ink:#ffffff; --accent-soft:#dcefe9;
  --paper:#fffdf8; --paper-ink:#1d1d1b;
  --draft:#6b7280; --draft-soft:#eceef1;
  --work:#e8750c; --work-soft:#fdebd8;
  --ok:#1a9a4b; --ok-soft:#dcf3e4;
  --danger:#b3261e;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-doc:"PT Serif",Georgia,"Times New Roman",serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1514; --panel:#172120; --ink:#e6ecea; --muted:#9aaaa6; --line:#2a3735;
  --accent:#3cc3a4; --accent-ink:#06201a; --accent-soft:#16372f;
  --paper:#f7f4ec; --paper-ink:#1d1d1b;
  --draft:#a4acb8; --draft-soft:#262d33;
  --work:#ff9a3d; --work-soft:#3a2513;
  --ok:#44d07a; --ok-soft:#153323;
  --danger:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1514; --panel:#172120; --ink:#e6ecea; --muted:#9aaaa6; --line:#2a3735;
  --accent:#3cc3a4; --accent-ink:#06201a; --accent-soft:#16372f;
  --paper:#f7f4ec; --paper-ink:#1d1d1b;
  --draft:#a4acb8; --draft-soft:#262d33;
  --work:#ff9a3d; --work-soft:#3a2513;
  --ok:#44d07a; --ok-soft:#153323;
  --danger:#ff8a80; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:280px 1fr;min-height:100%}
.rail{background:var(--panel);border-right:1px solid var(--line);padding:20px 16px;display:flex;flex-direction:column;gap:16px;min-width:0}
.brand{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:-.01em;line-height:1.2}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.02em;margin-top:4px}
.firmlist{display:flex;flex-direction:column;gap:4px;list-style:none;margin:0;padding:0}
.firmlist button{width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:9px 10px;display:flex;flex-direction:column;gap:1px}
.firmlist button:hover{background:var(--bg)}
.firmlist button[aria-current="true"]{background:var(--accent-soft)}
.firmlist .fn{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.firmlist .fi{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.main{padding:24px clamp(16px,3vw,36px);min-width:0;display:flex;flex-direction:column;gap:20px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.work{background:var(--work);border-color:var(--work);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:none}

.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.head h1{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,2.6vw,26px);margin:0;letter-spacing:-.015em;text-wrap:balance;line-height:1.2}
.head .sub{color:var(--muted);font-size:13.5px;margin-top:4px}
.back{border:0;background:none;color:var(--muted);padding:0;font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.back:hover{color:var(--ink)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}

/* firms overview */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.fcard{padding:16px;display:flex;flex-direction:column;gap:10px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:var(--r)}
.fcard:hover{border-color:var(--accent)}
.fcard .t{font-weight:700;font-size:15.5px}
.fcard .m{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.counts{display:flex;gap:6px;flex-wrap:wrap}

/* status pills */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px 3px 6px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill svg{width:18px;height:18px;flex:none}
.pill.draft{background:var(--draft-soft);color:var(--draft)}
.pill.signing{background:var(--work-soft);color:var(--work)}
.pill.signed{background:var(--ok-soft);color:var(--ok)}
.spin{animation:spin 2.4s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}

/* registry */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--bg)}
tbody tr:last-child td{border-bottom:0}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

/* requisites */
.reqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:0}
.req{padding:12px 16px;border-bottom:1px solid var(--line);min-width:0}
.req .k{font-size:12px;color:var(--muted)}
.req .v{font-weight:500;overflow-wrap:anywhere}
.req .v.mono{font-family:var(--f-mono);font-size:13.5px}
.req .v.none{color:var(--muted);font-weight:400;font-style:italic}

/* forms */
.form{display:flex;flex-direction:column;gap:22px}
fieldset{border:0;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
legend{font-family:var(--f-display);font-weight:500;font-size:14px;margin-bottom:12px;padding:0}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:500;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
.field input:focus,.field select:focus{border-color:var(--accent);outline:none}
.field input:disabled,.field select:disabled{opacity:.7}
.field.wide{grid-column:1/-1}
.hint{font-size:12px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.actions .sp{flex:1}

/* template picker */
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.tpl{text-align:left;padding:18px;display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:var(--r)}
.tpl:hover{border-color:var(--accent)}
.tpl .t{font-weight:700}
.tpl .d{font-size:13.5px;color:var(--muted)}
.tpl .tag{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}

/* editor */
.editor{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:20px;align-items:start}
.editor .side{padding:18px;display:flex;flex-direction:column;gap:16px}
.editor .side fieldset{grid-template-columns:1fr;gap:12px}
.auto{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:3px}
.auto b{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.statusbar{display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1px solid var(--line)}
.statusbar .row{display:flex;flex-wrap:wrap;gap:8px}

.sheetwrap{overflow-x:auto;min-width:0}
.sheet{background:var(--paper);color:var(--paper-ink);font-family:var(--f-doc);font-size:15px;line-height:1.6;padding:clamp(22px,5vw,56px) clamp(20px,5vw,60px);border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 8px 28px rgba(0,0,0,.08);max-width:760px;min-width:0}
.sheet .org{text-align:center;font-weight:700;text-transform:uppercase;font-size:14px;letter-spacing:.02em}
.sheet .orgm{text-align:center;font-size:12.5px;color:#555;border-bottom:1.5px solid #1d1d1b;padding-bottom:10px;margin-bottom:22px}
.sheet h2{text-align:center;font-size:20px;letter-spacing:.2em;margin:0}
.sheet .meta{display:flex;justify-content:space-between;gap:12px;font-size:14px;margin:10px 0 18px}
.sheet .subj{text-align:center;font-weight:700;margin-bottom:18px;text-wrap:balance}
.sheet p{margin:0 0 10px;text-align:justify}
.sheet .order{text-align:center;font-weight:700;letter-spacing:.25em;margin:16px 0 12px}
.sheet ol{margin:0 0 10px;padding-left:22px}
.sheet ol li{margin-bottom:8px;text-align:justify}
.sheet .sign{display:grid;grid-template-columns:1fr auto 1fr;gap:8px 16px;margin-top:40px;align-items:end;font-size:14.5px}
.sheet .sign .ln{border-bottom:1px solid #1d1d1b;width:110px;height:1px}
.sheet .sign .nm{text-align:right;font-weight:700}
.sheet .fill{background:#fff2b8;border-radius:3px;padding:0 3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.sheet .fill.fa{background:#d9efe7}
.sheet .fill.miss{background:#ffd9d4;color:#8a1c12;font-style:italic}
.sheet.clean .fill{background:none;padding:0;color:inherit;font-style:normal}
.stamp{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--ok);color:var(--ok);border-radius:6px;padding:4px 10px;font-family:var(--f-body);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;transform:rotate(-3deg);margin-top:18px}

.who{font-weight:600}
.lastmod{display:flex;flex-direction:column;gap:1px;font-size:13px;line-height:1.35}
.lastmod .num{font-size:12px;color:var(--muted)}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.hist li{display:grid;grid-template-columns:10px 1fr;gap:10px;font-size:13px;line-height:1.4}
.hist li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:5px}
.hist .num{color:var(--muted);font-size:12px}
.me{font-size:12.5px;color:var(--muted)}
.me b{color:var(--ink);font-weight:600}
.banner{background:var(--work-soft);color:var(--ink);border-radius:8px;padding:10px 14px;font-size:13.5px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;font-weight:500;z-index:10;max-width:calc(100% - 32px)}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--danger);border-radius:8px;padding:10px 12px;font-size:13.5px}

@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .rail{border-right:0;border-bottom:1px solid var(--line);padding:14px 16px;gap:10px}
  .firmlist{flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .firmlist li{flex:none;max-width:220px}
  .firmlist button{border:1px solid var(--line)}
  .railtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .rail .label{display:none}
  .editor{grid-template-columns:1fr}
  .main{padding-block:18px}
  .sheet .sign{grid-template-columns:1fr auto;}
  .sheet .sign .nm{grid-column:1/-1;text-align:left}
}
@media (min-width:861px){.railtop{display:flex;flex-direction:column;gap:14px}}

.who{font-weight:600}
.lastmod{display:flex;flex-direction:column;gap:1px;font-size:13px;line-height:1.35}
.lastmod .num{font-size:12px;color:var(--muted)}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.hist li{display:grid;grid-template-columns:10px 1fr;gap:10px;font-size:13px;line-height:1.4}
.hist li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:5px}
.hist .num{color:var(--muted);font-size:12px}
.me{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.me b{color:var(--ink);font-weight:600}
.me a,.linkbtn{color:var(--accent);font-size:12.5px;text-decoration:none;background:none;border:0;padding:0;font-weight:500}
.me a:hover,.linkbtn:hover{text-decoration:underline}
.gate{min-height:100%;display:grid;place-items:center;padding:32px 16px}
.gatecard{max-width:560px;width:100%;padding:clamp(22px,4vw,36px);display:flex;flex-direction:column;gap:14px}
.gatecard h1{font-family:var(--f-display);font-size:22px;margin:6px 0 0;letter-spacing:-.01em}
.gatecard p{margin:0}
.gbrand{font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--accent)}
.gbrand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted)}
.gerr{background:var(--work-soft);border-radius:8px;padding:10px 12px;font-size:13.5px}
.btn.big{padding:12px 18px;font-size:15px;align-self:flex-start}
.gopts{display:grid;gap:10px}
.gopt{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.gopt:hover{border-color:var(--accent)}
.gopt span{font-size:13.5px;color:var(--muted)}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.steps a{color:var(--accent);font-weight:600}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;padding:10px 16px;font-size:13.5px;background:var(--work-soft);border-bottom:1px solid var(--line)}
.backup{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.backup.due{border-color:var(--work);background:var(--work-soft)}
.bk-text{display:flex;flex-direction:column;gap:2px;min-width:0;font-size:13.5px}
.bk-text span{color:var(--muted)}
.backup.due .bk-text span{color:var(--ink)}
.note-box{background:var(--accent-soft);border-radius:var(--r);padding:14px 16px;font-size:14px;line-height:1.55;max-width:80ch}
#printArea .pageblock{break-after:page;page-break-after:always}
#printArea .pageblock:last-child{break-after:auto;page-break-after:auto}
#printArea{display:none}
@media print{
  html,body{background:#fff!important}
  :root{padding:0!important}
  body > *:not(#printArea){display:none!important}
  #printArea{display:block}
  #printArea .sheet{box-shadow:none;max-width:none;padding:0;border-radius:0;background:#fff}
  @page{size:A4;margin:18mm 15mm 18mm 25mm}
}
</style>
</head>
<body>
<div class="topbar" id="demoBar" hidden>Демо режим: Google созламалари ҳали киритилмаган, маълумотлар фақат шу браузерда сақланади.</div>
<div class="topbar" id="authBar" hidden>Сессия муддати тугади. Давом этиш учун қайта киринг. <button type="button" class="btn primary" data-g="reauth">Қайта кириш</button></div>
<div id="gate" class="gate" hidden></div>
<div class="app" hidden>
  <aside class="rail">
    <div class="railtop">
      <div class="brand">Фирмалар<small>Реквизитлар ва буйруқлар</small></div>
      <button class="btn primary" id="addFirmBtn" type="button"><svg viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Фирма қўшиш</button>
    </div>
    <div class="me" id="meLine" hidden></div>
    <div class="label">Фирмалар рўйхати</div>
    <ul class="firmlist" id="firmList"></ul>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="toast" id="toast" hidden></div>
<div id="printArea"></div>
<script>
"use strict";
/* ---------- constants ---------- */
const FIRM_FIELDS = [
  {g:"Асосий маълумотлар", f:[
    ["name","Фирма номи","МЧЖ «...»",1],
    ["form","Ташкилий-ҳуқуқий шакли","Масъулияти чекланган жамият"],
    ["inn","СТИР (ИНН)","9 рақам","mono"],
    ["oked","ИФУТ (ОКЭД)","","mono"],
    ["vat","ҚҚС тўловчи рўйхат коди","","mono"],
    ["regDate","Давлат рўйхатидан ўтган сана","","date"],
  ]},
  {g:"Манзил ва алоқа", f:[
    ["city","Шаҳар / туман","Тошкент ш."],
    ["address","Юридик манзил","",1],
    ["phone","Телефон","+998 ..."],
    ["email","Электрон почта",""],
  ]},
  {g:"Банк реквизитлари", f:[
    ["bank","Банк номи",""],
    ["account","Ҳисоб рақами","20 рақам","mono"],
    ["mfo","МФО","5 рақам","mono"],
  ]},
  {g:"Масъул шахслар", f:[
    ["directorTitle","Раҳбар лавозими","Директор"],
    ["director","Раҳбар Ф.И.О.",""],
    ["chiefAccountant","Бош бухгалтер Ф.И.О.",""],
  ]},
];
const STATUS = {
  draft:{t:"Черновик",cls:"draft"},
  signing:{t:"Имзолаш жараёнида",cls:"signing"},
  signed:{t:"Имзоланган",cls:"signed"},

class AuthErr extends Error{}
class ConflictErr extends Error{}
let TOKEN=null, TOKEN_EXP=0;
function loadScript(src){
  return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.async=true; s.onload=res; s.onerror=()=>rej(new Error("Скрипт юкланмади: "+src)); document.head.appendChild(s); });
}
/* must be called synchronously from a click, or the browser blocks Google's popup */
function requestToken(prompt){
  return new Promise((res,rej)=>{
    const client = google.accounts.oauth2.initTokenClient({
      client_id: CONFIG.CLIENT_ID, scope: SCOPES,
      callback: r=>{
        if(r.error){ rej(new Error(r.error_description||r.error)); return; }
        TOKEN=r.access_token; TOKEN_EXP=Date.now()+(Number(r.expires_in||3600)-120)*1000;
        ss.set(LSK.tok, JSON.stringify({t:TOKEN,e:TOKEN_EXP}));
        $("#authBar").hidden=true; scheduleExpiry(); res();
      },
      error_callback: e=>rej(new Error(e?.type==="popup_closed"?"Кириш ойнаси ёпилди":"Кириш ойнаси очилмади. Браузерда pop-up ойналарга рухсат беринг.")),
    });
    client.requestAccessToken({ prompt: prompt||"", login_hint: ME.email||undefined });
  });
}
let expTimer=null;
function scheduleExpiry(){ clearTimeout(expTimer); expTimer=setTimeout(needAuth, Math.max(0,TOKEN_EXP-Date.now())); }
function needAuth(){ if(!DEMO && !$("#gate").hidden) return; $("#authBar").hidden=false; }

async function api(method, url, body){
  if(!TOKEN || Date.now()>TOKEN_EXP){ needAuth(); throw new AuthErr("Сессия тугаган"); }
  let r;
  try{
    r = await fetch(url,{ method, headers:{ Authorization:"Bearer "+TOKEN, ...(body?{"Content-Type":"application/json"}:{}) }, body: body?JSON.stringify(body):undefined });
  }catch(e){ throw new Error("Интернет алоқаси йўқ"); }
  if(r.status===401){ TOKEN=null; ss.del(LSK.tok); needAuth(); throw new AuthErr("Сессия тугаган"); }
  if(!r.ok){
    let m=""; try{ m=(await r.json()).error?.message||""; }catch(e){}
    const err=new Error(r.status===403||r.status===404?"Жадвалга кириш ҳуқуқи йўқ ёки у ўчирилган":(m||"Хато "+r.status)); err.status=r.status; throw err;
  }
  return r.status===204 ? null : r.json();
}

    return ["firms","orders","log"].every(n=>names.includes(n));
  },
  async load(){
    const q = ["firms!A2:E","orders!A2:E","log!A2:F"].map(x=>"ranges="+encodeURIComponent(x)).join("&");
    const r = await api("GET", `${SHEETS}/${DB_ID}/values:batchGet?${q}&valueRenderOption=UNFORMATTED_VALUE`);
    const [f,o,l] = r.valueRanges.map(v=>v.values||[]);

  },
  async readRow(kind,row){
    const r = await api("GET", `${SHEETS}/${DB_ID}/values/${encodeURIComponent(`${kind}!A${row}:E${row}`)}?valueRenderOption=UNFORMATTED_VALUE`);
    return (r.values||[])[0]||[];
  },
  async writeRow(kind,row,vals){
    await api("PUT", `${SHEETS}/${DB_ID}/values/${encodeURIComponent(`${kind}!A${row}:E${row}`)}?valueInputOption=RAW`, {values:[vals]});
  },
  async appendRow(kind,vals){
    const r = await api("POST", `${SHEETS}/${DB_ID}/values/${encodeURIComponent(`${kind}!A:${kind==="log"?"F":"E"}`)}:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS`, {values:[vals]});
    const m = /![A-Z]+(\d+)/.exec(r?.updates?.updatedRange||""); return m?+m[1]:null;
  },
};

/* ---------- generic operations ---------- */
async function refresh(){
  const d = await STORE.load();
  ROWS.firms=d.firms; ROWS.orders=d.orders; LOG=d.log;
  rebuild(); S.ready=true; LAST_SYNC=Date.now(); setSync();
}
async function assertFresh(kind, ex, id){
  const cur = await STORE.readRow(kind, ex.row);
  if(cur[0]!==id || (+cur[2]||0)!==ex.updatedAt){ await refresh(); throw new ConflictErr(); }
}
async function addLog(kind,id,note,at){
  const e={at,email:ME.email,name:ME.name,kind,id,note};
  await STORE.appendRow("log",[at,e.email,e.name,kind,id,note]);
  LOG.push(e);
}
async function putItem(kind, obj, note){
  const ex = ROWS[kind][obj.id];
  if(ex) await assertFresh(kind, ex, obj.id);
  const at = Date.now();
  const o = {...obj, updatedAt:at, updatedBy:ME.email};
  if(!o.createdBy) o.createdBy = ME.email;
  const vals = [o.id, JSON.stringify(o), at, ME.email, ""];
  let row;
  if(ex){ await STORE.writeRow(kind, ex.row, vals); row=ex.row; }
  else  { row = await STORE.appendRow(kind, vals); }
  ROWS[kind][o.id] = {row:row||0, obj:o, updatedAt:at, updatedBy:ME.email, deleted:false};
  await addLog(kind, o.id, note, at);
  if(!row) await refresh(); else rebuild();
  return o;
}
async function delItem(kind, id, note){
  const ex = ROWS[kind][id]; if(!ex) return;
  await assertFresh(kind, ex, id);
  const at = Date.now();
  await STORE.writeRow(kind, ex.row, [id, JSON.stringify({...ex.obj, updatedAt:at, updatedBy:ME.email}), at, ME.email, 1]);
  ex.deleted=true; ex.updatedAt=at; ex.updatedBy=ME.email;
  await addLog(kind, id, note, at);
  rebuild();
}

}

function fileStamp(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function safeName(n){ return String(n||"firma").replace(/[«»"\\/:*?<>|]+/g,"").replace(/\s+/g,"_").slice(0,60); }
function firmLog(f){ const ids=new Set([f.id, ...firmOrders(f.id).map(o=>o.id)]); return LOG.filter(l=>ids.has(l.id)).sort((a,b)=>a.at-b.at); }
function orderFieldsText(o){ const tpl=TEMPLATES.find(t=>t.id===o.tplId); if(!tpl) return ""; return tpl.fields.map(([k,l,type])=>{ let v=o.values?.[k]||""; if(type==="date") v=fmtDate(v); return v?l+": "+v:""; }).filter(Boolean).join("; "); }
function saveBlob(blob, name){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000); }
async function exportXlsx(f){
  if(!window.XLSX) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");
  const req=[["Реквизит","Қиймати"]];
  FIRM_FIELDS.forEach(g=>g.f.forEach(([k,l])=>req.push([l, k==="regDate"?fmtDate(f[k]):(f[k]||"")])));
  const ord=[["№","Сана","Буйруқ номи","Ҳолати","Тўлдирилган реквизитлар","Охирги ўзгартирган","Охирги ўзгариш","Имзоланган вақт"]];
  firmOrders(f.id).slice().reverse().forEach(o=>ord.push([o.values?.number||"", fmtDate(o.values?.date), o.title, STATUS[o.status]?.t||o.status, orderFieldsText(o), nameOf(o.updatedBy), fmtStamp(o.updatedAt), o.signedAt?fmtStamp(o.signedAt):""]));
  const hist=[["Вақт","Ким","Почта","Ҳужжат","Нима қилинди"]];
  firmLog(f).forEach(l=>{ const o=S.orders.find(x=>x.id===l.id); hist.push([fmtStamp(l.at), l.name||nameOf(l.email), l.email, l.kind==="firms"?"Фирма реквизитлари":(o?("Буйруқ № "+(o.values?.number||"")+" — "+o.title):"Буйруқ"), l.note]); });
  const wb=XLSX.utils.book_new();
  const add=(rows,name,cols)=>{ const ws=XLSX.utils.aoa_to_sheet(rows); ws["!cols"]=cols.map(w=>({wch:w})); XLSX.utils.book_append_sheet(wb,ws,name); };
  add(req,"Реквизитлар",[34,60]); add(ord,"Буйруқлар",[6,12,42,20,70,24,18,18]); add(hist,"Тарих",[18,24,28,50,40]);
  XLSX.writeFile(wb, safeName(f.name)+"_"+fileStamp()+".xlsx");
}

function fillBody(tpl, values, f, clean){
  const wrap=(v,cls)=>clean?esc(v):`<span class="fill ${cls}">${esc(v)}</span>`;
  const get=(key)=>{
    if(key.startsWith("firm.")){ const v=f?.[key.slice(5)]; return v?wrap(v,"fa"):wrap("["+key.slice(5)+" киритилмаган]","miss"); }
    const def=tpl.fields.find(x=>x[0]===key); let v=values[key];
    if(def && def[2]==="date") v=fmtDate(v);
    return v?wrap(v,""):(clean?"________":wrap("["+(def?def[1]:key)+"]","miss"));
  };
  return tpl.body.replace(/\{\{([\w.]+)\}\}/g,(_,k)=>get(k));
}

const DL_ICON='<svg viewBox="0 0 16 16" fill="none"><path d="M8 2.5v8M4.5 7.5 8 11l3.5-3.5M3 13.5h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const PRINT_ICON='<svg viewBox="0 0 16 16" fill="none"><path d="M4 6V2h8v4M4 12H2.5V6.5h11V12H12M4 9.5h8V14H4z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>';
function render(){
  if(!$("#gate").hidden) return;
  renderRail();
  const views={home:vHome,firm:vFirm,export:vExport,firmForm:vFirmForm,tpl:vTpl,order:vOrder};
  $("#main").innerHTML=(views[V.view]||vHome)();
}
/* ---------- events ---------- */
document.addEventListener("click", async e=>{
  const t=e.target.closest("#addFirmBtn,[data-firm],[data-tab],[data-filter],[data-act],[data-tpl],[data-order],[data-set]");
  if(!t) return;
  if(t.dataset.firm){ return go({view:"firm",firmId:t.dataset.firm,tab:"orders",filter:"all"}); }
  if(t.dataset.tab){ return go({tab:t.dataset.tab}); }
  if(t.dataset.filter){ return go({filter:t.dataset.filter}); }
  if(t.dataset.tpl){
    const tpl=TEMPLATES.find(x=>x.id===t.dataset.tpl); const f=firm(V.firmId);
    const values={};
    tpl.fields.forEach(([k,,type,opt])=>{
      if(type==="select") values[k]=opt[0];
      else if(typeof opt==="string"&&opt.startsWith("@")) values[k]=f?.[opt.slice(1)]||"";
      else if(k==="date") values[k]=today();
      else if(k==="number") values[k]=String(firmOrders(V.firmId).length+1);
    });
    return go({view:"order",draft:{id:uid(),firmId:V.firmId,tplId:tpl.id,title:tpl.title,status:"draft",values,createdAt:Date.now()}});
  }
  if(t.dataset.order){ const o=S.orders.find(x=>x.id===t.dataset.order); if(o) go({view:"order",draft:JSON.parse(JSON.stringify(o))}); return; }
  if(t.dataset.set){
    const o=V.draft; const st=t.dataset.set;
    const saved=S.orders.find(x=>x.id===o.id);
    const changed=!saved || JSON.stringify(saved.values)!==JSON.stringify(o.values);
    let note;
    if(!saved) note = st==="draft"?"Яратилди (черновик)":st==="signing"?"Яратилди ва имзолашга юборилди":"Яратилди ва имзоланган деб белгиланди";
    else if(st===saved.status) note = changed?"Реквизитлар таҳрирланди":"Қайта сақланди";
    else note = (changed?"Таҳрирланди, ":"") + (st==="draft"?"черновикка қайтарилди":st==="signing"?"имзолаш жараёнига ўтказилди":"имзоланган деб белгиланди");
    o.status=st; if(st==="signed") o.signedAt=Date.now();
    t.disabled=true;
    try{ V.draft = await putItem("orders", o, note); toast(st==="draft"?"Черновикка сақланди":st==="signing"?"Ҳолат: имзолаш жараёнида":"Буйруқ имзоланган деб белгиланди"); }
    catch(err){ t.disabled=false; if(saved) o.status=saved.status; toast(explain(err)); if(err instanceof ConflictErr) go({view:"firm",tab:"orders"}); return; }
    if(st==="draft"){ render(); } else go({view:"firm",tab:"orders"});
    return;
  }
  const a=t.dataset.act||(t.id==="addFirmBtn"?"addFirm":"");
  if(a==="addFirm") return go({view:"firmForm",draft:{id:uid(),createdAt:Date.now()}});
  if(a==="home") return go({view:"home",firmId:null});
  if(a==="toFirm") return go({view:"firm"});
  if(a==="newOrder") return go({view:"tpl"});
  if(a==="editFirm") return go({view:"firmForm",draft:{...firm(V.firmId)}});
  if(a==="askDel"){ V.confirm=true; return render(); }
  if(a==="cancelDel"){ V.confirm=false; return render(); }
  if(a==="delFirm"){
    const n=firm(V.firmId)?.name;
    try{ for(const o of firmOrders(V.firmId)) await delItem("orders", o.id, "Фирма билан бирга ўчирилди"); await delItem("firms", V.firmId, "Фирма ўчирилди"); }
    catch(err){ toast(explain(err)); return render(); }
    toast(`«${n}» ўчирилди`); return go({view:"home",firmId:null});
  }
  if(a==="delOrder"){
    try{ await delItem("orders", V.draft.id, "Буйруқ ўчирилди"); }catch(err){ toast(explain(err)); return; }
    toast("Буйруқ ўчирилди"); return go({view:"firm",tab:"orders"});
  }
  if(a==="export") return go({view:"export"});
  if(a==="bkXlsx"||a==="bkJson"){
    try{
      if(a==="bkXlsx"){ toast("Excel тайёрланмоқда…"); await backupXlsx(); } else backupJson();
      try{ await addLog("base","all","Захира нусха олинди ("+(a==="bkXlsx"?"Excel":"JSON")+")", Date.now()); }catch(e){}
      toast("Захира нусха юклаб олинди: «Загрузки» папкасини текширинг"); render();
    }catch(err){ toast("Юклаб бўлмади: "+(err?.message||"хато")); }
    return;
  }
  if(a==="expXlsx"||a==="expJson"||a==="expPrint"){
    const f=firm(V.firmId); if(!f) return;
    try{
      if(a==="expXlsx"){ toast("Excel тайёрланмоқда…"); await exportXlsx(f); }
      if(a==="expJson") exportJson(f);
      if(a==="expPrint" && !exportPrint(f)) return;
      const what=a==="expXlsx"?"Excel":a==="expJson"?"JSON нусха":"PDF/чоп этиш";
      addLog("firms", f.id, "Маълумотлар юклаб олинди ("+what+")", Date.now()).catch(()=>{});
      if(a!=="expPrint") toast("Файл юклаб олинди: «Загрузки» папкасини текширинг");
    }catch(err){ toast("Юклаб бўлмади: "+(err?.message||"хато")); }
    return;
  }
  if(a==="print"){ $("#printArea").innerHTML=sheetHTML(V.draft,true); window.print(); return; }
});
document.addEventListener("keydown",e=>{ if(e.key==="Enter"&&e.target.matches("tr[data-order]")) e.target.click(); });
document.addEventListener("input",e=>{
  const form=e.target.closest("#orderForm");
  if(form){ V.draft.values[e.target.name]=e.target.value; $("#sheetWrap").innerHTML=sheetHTML(V.draft); }
  if(e.target.closest("#firmForm")){ V.draft[e.target.name]=e.target.value; }
});
document.addEventListener("change",e=>{
  if(e.target.closest("#orderForm")){ V.draft.values[e.target.name]=e.target.value; $("#sheetWrap").innerHTML=sheetHTML(V.draft); }
});
document.addEventListener("submit",async e=>{
  if(e.target.id==="firmForm"){
    e.preventDefault();
    new FormData(e.target).forEach((v,k)=>V.draft[k]=String(v).trim());
    if(!V.draft.name){ $("#firmErr").textContent="Фирма номини киритинг."; $("#ff_name").focus(); return; }
    const isNewF=!S.firms.some(x=>x.id===V.draft.id);
    try{ V.draft = await putItem("firms", V.draft, isNewF?"Фирма қўшилди":"Реквизитлар ўзгартирилди"); }catch(err){ $("#firmErr").textContent=explain(err); if(err instanceof ConflictErr) setTimeout(()=>go({view:"firm",tab:"reqs"}),2500); return; }
    toast("Фирма реквизитлари сақланди");
    go({view:"firm",firmId:V.draft.id,tab:"reqs"});
  }
  if(e.target.id==="orderForm") e.preventDefault();
});

/* ---------- entry screens: sign in, choose or create the base ---------- */
const sheetUrl = () => `https://docs.google.com/spreadsheets/d/${DB_ID}/edit`;
function showGate(state, msg){
  $(".app").hidden = true; const g=$("#gate"); g.hidden = false;
  const err = msg ? `<div class="gerr">${esc(msg)}</div>` : "";
  const brand = `<div class="gbrand">Фирмалар<small>Реквизитлар ва буйруқлар</small></div>`;
  let body = "";
  if(state==="loading") body = `<p class="hint">Юкланмоқда…</p>`;
  if(state==="login") body = `
    <h1>Дастурга кириш</h1>
    <p>Иш Gmail ҳисобингиз билан киринг. Фақат раҳбар рухсат берган ҳисоблар кира олади.</p>
    ${err}
    <button type="button" class="btn primary big" data-g="login">${GICON}Google орқали кириш</button>`;
  if(state==="setup") body = `
    <h1>Базани танланг</h1>
    <p>Сиз: <b>${esc(ME.name)}</b> <span class="hint">${esc(ME.email)}</span></p>
    ${err}
    <div class="gopts">
      <button type="button" class="gopt" data-g="pick"><b>Мавжуд базага уланиш</b><span>Ёрдамчилар учун. Раҳбар сизга «Фирмалар базаси (дастур)» жадвалини улашган бўлиши керак. Уни рўйхатдан танлайсиз.</span></button>
      <button type="button" class="gopt" data-g="create"><b>Янги база яратиш</b><span>Фақат раҳбар учун, бир марта. Google Drive'ингизда янги жадвал очилади.</span></button>
    </div>
    <button type="button" class="back" data-g="logout">← Бошқа ҳисоб билан кириш</button>`;
  if(state==="created") body = `
    <h1>База яратилди</h1>
    <p>Google Drive'ингизда <b>«Фирмалар базаси (дастур)»</b> жадвали пайдо бўлди. Ёрдамчиларингиз кириши учун уни улашинг:</p>
    <ol class="steps">
      <li><a href="${esc(sheetUrl())}" target="_blank" rel="noopener">Жадвални очинг</a></li>
      <li>Ўнг юқоридаги <b>Share</b> (Настройки доступа) тугмасини босинг</li>
      <li>Ёрдамчиларнинг Gmail манзилини киритинг, ҳуқуқ: <b>Editor</b> (Редактор)</li>
      <li>«General access» бўлимида <b>Restricted</b> (Доступ ограничен) турганини текширинг</li>
    </ol>
    <p class="hint">Жадвални қўлда таҳрирламанг: дастур уни ўзи юритади.</p>
    <button type="button" class="btn primary big" data-g="enter">Дастурга ўтиш</button>`;
  if(state==="error") body = `<h1>Хатолик</h1>${err}<button type="button" class="btn" data-g="reload">Қайта уриниш</button>`;
  g.innerHTML = `<div class="gatecard card">${brand}${body}</div>`;
}
const GICON = '<svg viewBox="0 0 18 18" width="18" height="18"><path fill="#4285F4" d="M17.6 9.2c0-.6-.1-1.2-.2-1.7H9v3.3h4.8a4.1 4.1 0 0 1-1.8 2.7v2.2h2.9c1.7-1.6 2.7-3.9 2.7-6.5z"/><path fill="#34A853" d="M9 18c2.4 0 4.5-.8 6-2.2l-2.9-2.2c-.8.5-1.8.9-3.1.9-2.4 0-4.4-1.6-5.1-3.8H.9v2.3A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.9 10.7a5.4 5.4 0 0 1 0-3.4V5H.9a9 9 0 0 0 0 8z"/><path fill="#EA4335" d="M9 3.6c1.3 0 2.5.5 3.5 1.4l2.6-2.6A9 9 0 0 0 .9 5l3 2.3C4.6 5.2 6.6 3.6 9 3.6z"/></svg>';

function showApp(){
  $("#gate").hidden = true; $(".app").hidden = false;
  const l=$("#meLine");
  l.innerHTML = `<span>Сиз: <b>${esc(ME.name)}</b></span>` +
    (DEMO ? "" : `<a href="${esc(sheetUrl())}" target="_blank" rel="noopener">Базани Google Sheets'да очиш</a><button type="button" class="linkbtn" data-g="switch">Базани алмаштириш</button><button type="button" class="linkbtn" data-g="logout">Чиқиш</button>`) +
    `<span class="hint" id="syncLine"></span>`;
  l.hidden = false; setSync(); render();
}

async function afterLogin(){
  const u = await api("GET","https://www.googleapis.com/oauth2/v3/userinfo");
  ME.email = u.email; ME.name = u.name || u.email; NAMES[ME.email]=ME.name;
  if(!DB_ID){ showGate("setup"); return; }
  try{ await refresh(); }
  catch(e){ if(e instanceof AuthErr) throw e; DB_ID=null; ls.del(LSK.db); showGate("setup","Аввалги базани очиб бўлмади: "+e.message); return; }
  showApp();
}

let pickerReady=null;
function loadPicker(){
  if(!pickerReady) pickerReady = loadScript("https://apis.google.com/js/api.js").then(()=>new Promise(r=>gapi.load("picker",r)));
  return pickerReady;
}
async function pickBase(){
  await loadPicker();
  return new Promise(res=>{
    const view = new google.picker.DocsView(google.picker.ViewId.SPREADSHEETS).setMode(google.picker.DocsViewMode.LIST).setIncludeFolders(false);
    const shared = new google.picker.DocsView(google.picker.ViewId.SPREADSHEETS).setMode(google.picker.DocsViewMode.LIST).setOwnedByMe(false);
    new google.picker.PickerBuilder()
      .addView(shared).addView(view)
      .setOAuthToken(TOKEN).setDeveloperKey(CONFIG.API_KEY).setAppId(CONFIG.APP_ID)
      .setTitle("«Фирмалар базаси (дастур)» жадвалини танланг").setLocale("ru")
      .setCallback(d=>{ if(d.action===google.picker.Action.PICKED) res(d.docs[0].id); else if(d.action===google.picker.Action.CANCEL) res(null); })
      .build().setVisible(true);
  });
}

document.addEventListener("click", async e=>{
  const t = e.target.closest("[data-g]"); if(!t) return;
  const a = t.dataset.g;
  try{
    if(a==="login"){ await requestToken("select_account"); showGate("loading"); await afterLogin(); }
    if(a==="reauth"){ await requestToken(""); toast("Давом этишингиз мумкин"); poll(); }
    if(a==="reload"){ location.reload(); }
    if(a==="create"){
      t.disabled=true; showGate("loading");
      DB_ID = await GS.create(); ls.set(LSK.db, DB_ID); await refresh(); showGate("created");
    }
    if(a==="enter"){ showApp(); }
    if(a==="pick"){
      const id = await pickBase(); if(!id) return;
      showGate("loading");
      let ok=false; try{ ok = await GS.check(id); }catch(err){ showGate("setup","Бу жадвални очиб бўлмади: "+err.message); return; }
      if(!ok){ showGate("setup","Танланган жадвал фирмалар базаси эмас. «Фирмалар базаси (дастур)» жадвалини танланг."); return; }
      DB_ID=id; ls.set(LSK.db,id); await refresh(); showApp();
    }
    if(a==="switch"){ DB_ID=null; ls.del(LSK.db); showGate("setup"); }
    if(a==="logout"){
      try{ if(TOKEN) google.accounts.oauth2.revoke(TOKEN,()=>{}); }catch(err){}
      TOKEN=null; ss.del(LSK.tok); ME.email=""; showGate("login");
    }
  }catch(err){
    if(a==="login"||a==="create"||a==="pick") showGate(a==="login"?"login":"setup", err.message);
    else toast(err.message);
  }
});

/* ---------- boot ---------- */
(async()=>{
  if(DEMO){
    ME.email="demo@example.com"; ME.name="Демо фойдаланувчи";
    await refresh(); showApp();
    $("#demoBar").hidden=false;
    return;
  }
  DB_ID = ls.get(LSK.db);
  showGate("loading");
  try{ await loadScript("https://accounts.google.com/gsi/client"); }
  catch(e){ showGate("error","Google хизматлари юкланмади. Интернетни текширинг."); return; }
  loadPicker().catch(()=>{});
  try{ const t=JSON.parse(ss.get(LSK.tok)||"null"); if(t && t.e>Date.now()){ TOKEN=t.t; TOKEN_EXP=t.e; scheduleExpiry(); } }catch(e){}
  if(TOKEN){ try{ await afterLogin(); return; }catch(e){} }
  showGate("login");
})();
